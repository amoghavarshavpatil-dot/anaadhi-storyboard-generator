per_shot_runtime:
- Resolve the exact source shot and all inherited/global constraints.
- Resolve approved reference assets reachable from the repository; attach them only if the chosen SuperCool image tool supports them.
- Read live SuperCool credit balance/cost when available.
- Generate exactly one still candidate.
- Do not auto-regenerate for aesthetics.
- Record asset/session/download metadata and credit before/after in the run ledger.
- Advance to the next shot only after the current shot has a retrievable candidate.
failure_policy:
  insufficient_credits: STOP_SUCCESSFULLY_AT_LAST_COMPLETED_SHOT
  paid_or_unknown_failure: STOP_TO_AVOID_DUPLICATE_SPEND
  missing_required_reference_support: STOP_BEFORE_SPEND
  asset_not_retrievable_in_supercool: STOP_BEFORE_NEXT_SHOT
  source_or_continuity_blocker: STOP_AND_RECORD_BLOCKER
  never_skip_failed_shot_to_generate_later_shots: true
review_policy:
  generated_candidate_is_not_final: true
  user_review_required: true
  approval_action: After user approves a shot, record FINAL_APPROVED with the exact SuperCool asset ID; do not regenerate it.
  rejection_action: Only regenerate a rejected shot after separate explicit approval, so remaining credits are not silently consumed.
ledger_path: production/supercool/runs/ANAADHI_SC001_SC005_SUPERCOOL_RUN01/ledger.yaml
