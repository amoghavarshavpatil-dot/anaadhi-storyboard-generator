version: 1
run_id: ANAADHI_SC001_SC005_SUPERCOOL_RUN01
status: ARMED_AWAITING_CODESPACES_AGENT_EXECUTION
purpose: Generate storyboard still candidates for SC001-SC005 sequentially through the authenticated SuperCool MCP connection.
authorization:
  explicit_user_approval: true
  scope: SC001 through SC005 only
  media_type: IMAGE_STILL_ONLY
  candidates_per_shot: 1
  automatic_retries: false
  finalization_requires_user_review: true
  supercool_credit_spend_authorized: EXISTING_CREDIT_BALANCE_ONLY
  cash_spend_authorized_usd: 0
  pay_as_you_go_must_remain_off: true
  topup_forbidden: true
  subscription_change_forbidden: true
credit_control:
  observed_balance_from_user_screenshot: 6173
  observed_plan: Mini
  observed_pay_as_you_go: 'OFF'
  runtime_balance_authority: Query authenticated SuperCool account/billing/credits tool before first paid generation and whenever available.
  fallback_when_balance_tool_unavailable: Continue only until SuperCool returns explicit insufficient-credit response; do not retry that shot and stop the run.
  stop_before_unaffordable_request_when_cost_can_be_known: true
  never_enable_payg_or_purchase_credits: true
supercool_session:
  preferred_name: ANAADHI Storyboard SC001-SC005 Run 01
  require_account_retention: true
  first_asset_retention_gate:
    shot: SC001_SH001
    after_generation:
    - Confirm returned asset_id or equivalent.
    - Confirm asset/session is retrievable from authenticated SuperCool account.
    - Confirm a download/retrieval URL or equivalent is returned or discoverable.
    on_failure: STOP_BEFORE_SC001_SH002
  asset_naming: ANAADHI_{shot_id}_CANDIDATE_01
generation_policy:
  tool_selection:
  - Use a SuperCool still-image/photo-generation tool, never a video-generation tool.
  - Prefer the most credit-efficient available photoreal cinematic image model that supports the shot's required reference images.
  - Inspect the tool schema before spending credits. If required reference inputs cannot be provided, STOP rather than generate an unbound continuity image.
  target:
    aspect_ratio: '2.40:1'
    target_raster: 3840x1600
    rule_if_exact_raster_unsupported: Use the closest native 2.40:1/ultrawide landscape mode at highest normal-quality resolution; record native dimensions; do not pay for separate upscale during this run.
  continuity:
  - Use all approved character/location/prop reference assets cited by the shot package when the SuperCool tool accepts references.
  - Never substitute a different face, costume, location, prop, vehicle or technology design when an approved reference exists.
  - Never invent a missing victim name, label, code, route, portal, location ID or character identity.
  - Represented/Parallel-Earth layers must obey each scene's exact SB/TP/GF/ANCH/WC/RST boundary and leave zero residue after RST.
  output_status: CANDIDATE_READY
  do_not_mark_final: true
  do_not_create_video: true
  do_not_create_audio: true
  do_not_use_heygen: true
  do_not_use_other_paid_media_tools: true
source_map:
  SC001:
    mode: LEGACY_SCENE_YAML_EXPLICIT_USER_GENERATION_OVERRIDE
    path: scenes/001/scene.yaml
    shot_count: 8
    env6: TP001 / SB001 / GF10 1/11 / Band A / EP0+EP1+EP3+EP4+EP5+EP-U / OBS01 / ANCH01 / INV6-01 / ENV-CAB-008 + ENV-BHG-001 / WC001/A / VAR6-01+VAR6-03+VAR6-04+VAR6-05 / RST01
    special_boundary: 'His vision fractures. PARALLEL EARTH FLASHES: -> BACK TO PRESENT.'
    note: Use existing per-shot visual_prompt + negative_prompt; do not reinterpret DRAFT status as permission to change screenplay or continuity.
