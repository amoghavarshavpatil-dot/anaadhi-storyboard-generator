work_page_execution_packets:
  - handoff_id: CONSENT-WP-ANAADHI-001
    packet_id: HEYGEN-AQ-001
    subject: anaadhi
    group_id_source: locked_existing_private_identities.anaadhi.group_id
    prerequisite_checks:
      - Re-query the exact existing private group by group_id immediately before any consent action.
      - Confirm the returned group identity/name corresponds to the locked Anaadhi identity; fail closed on mismatch or not-found.
      - Read the current consent_status returned by HeyGen.
    decision:
      if_current_consent_is_affirmative:
        action: DO_NOT_INITIATE_A_NEW_CONSENT_FLOW
        next: Record the exact returned affirmative state and observation evidence, then proceed to closure validation.
      if_current_consent_is_null_or_non_affirmative:
        action: >-
          On the Work page only, invoke HeyGen create-avatar-consent for this exact existing group_id. Omit rerouteUrl unless the Work page has an explicitly approved safe callback;
          when omitted, use HeyGen's default consent completion destination.
        expected_return: consent_completion_url
        return_is_not_closure: true
        user_action_required: Complete the HeyGen consent flow in the returned browser page for this exact identity.
        post_user_completion_action: Re-query the same exact group_id and read the authoritative consent_status.
    prohibited:
      - create a new Anaadhi group
      - create or replace Anaadhi source media
      - create a new look merely to obtain consent
      - submit or render any video
      - write APPROVED manually
      - treat consent URL creation or browser opening as approval

  - handoff_id: CONSENT-WP-AARATHI-001
    packet_id: HEYGEN-AQ-002
    subject: aarathi
    group_id_source: locked_existing_private_identities.aarathi.group_id
