version: 1
project: ANAADHI
phase: HEYGEN_BATCH_MEDIA_INPUT_CONTROL
status: ACTIVE__NO_GENERATION_SUBMITTED

purpose: >-
  Machine-readable B01-B34 media-input contract for the ANAADHI HeyGen pipeline.
  This file does not generate avatars, locations, props, shots, dialogue, or audio.
  It binds each production batch to the existing canonical P0/P1 controls and defines
  only HeyGen-supported submission forms. The OpenAI Work page performs avatar/media
  generation and HeyGen execution from jobs prepared in GitHub.

canonical_sources:
  batch_index: production/batches/BATCH_INDEX.md
  p0_foundation: production/batches/ANAADHI_BATCH_FOUNDATION.py
  p1_requirements: production/references/BATCH_REFERENCE_REQUIREMENTS.yaml
  p1_bindings: production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml
  p1_registry: production/references/REFERENCE_REGISTRY.yaml
  heygen_acceptance_contract: production/heygen/HEYGEN_API_ACCEPTANCE_CONTRACT.yaml
  public_media_bridge: production/heygen/HEYGEN_PUBLIC_MEDIA_BRIDGE.yaml
  shot_engine: production/shots/SHOT_PRODUCTION_ENGINE.yaml

execution_ownership:
  this_chat:
    allowed:
      - author_and_update_github_control_code
      - build_batch_media_manifests
      - build_shot_api_payloads_after_P1_gate
      - build_kannada_lipsync_payloads_after_P2_picture_lock
      - validate_supported_HeyGen_fields
      - archive_job_ids_status_and_QC_metadata
    forbidden:
      - generate_avatar_visuals
      - generate_location_visuals
      - generate_prop_visuals
      - silently_submit_paid_HeyGen_jobs_without_the_work_page_execution_gate
  openai_work_page:
    owns:
      - all_avatar_visual_generation_and_uploads
      - HeyGen_execution_of_GitHub_prepared_jobs
      - source_media_uploads_when_required_by_HeyGen
      - return_HeyGen_job_ids_and_outputs_for_registry_update
  locations_and_props:
    rule: EXISTING_APPROVED_ASSETS_ONLY
    regenerate_in_this_chat: false
    regenerate_in_work_page: false

heygen_supported_media_forms:
  avatar_identity:
    accepted:
      - avatar_look_id
    owner: OPENAI_WORK_PAGE
    rule: private_avatar_consent_must_pass_before_video_generation
  arbitrary_source_image:
    endpoint_family: create_video_from_image
    accepted:
      - {type: url, field: url}
      - {type: asset_id, field: asset_id}
  avatar_background:
    endpoint_family: create_video_from_avatar_or_image
    accepted:
      - {type: image_url, fields: [type, url], type_value: image}
      - {type: image_asset_id, fields: [type, asset_id], type_value: image}
    not_supported_as_generic_field:
      - video_background_in_current_connected_create_video_schema
      - environment_reference_array
      - prop_reference_array
  recorded_dialogue_audio:
    accepted:
      - public_https_audio_url
      - HeyGen_audio_asset_id
    rule: uploaded_creator_recording_bypasses_TTS_voice_tuning
  precision_lipsync:
    video_input: [public_https_video_url, HeyGen_video_asset_id]
    audio_input: [public_https_audio_url, HeyGen_audio_asset_id]
    mode: precision
    enable_dynamic_duration: false
    enable_speech_enhancement: false
    enable_caption: false
    enable_watermark: false
    keep_same_format: true
  props:
    generic_direct_prop_field: false
    allowed_routes:
      - prop_already_present_in_approved_source_plate_or_source_video
      - supported_template_variable_when_a_specific_HeyGen_template_contract_is_later_verified
    rule: never_invent_unsupported_JSON_fields
  locations:
    direct_avatar_background_route: approved_still_image_only
    cinematic_video_agent_route: >-
      Do not claim structured environment/prop reference ingestion until the exact
      session-resource ingestion endpoint and payload are verified. Until then,
      approved location media remain canonical inputs but are not fabricated into
      unsupported Video Agent fields.

media_url_policy:
  preferred_public_bridge: "https://raw.githubusercontent.com/amoghavarshavpatil-dot/anaadhi-storyboard-generator/main/{path}"
  alternate: HeyGen_asset_id
  temporary_HeyGen_output_urls:
    archive_immediately: true
    destination: Google_Drive_then_GitHub_registry

batch_defaults:
  avatar_slots: INHERIT_EXACT_NAMED_CHARACTERS_FROM_P0_FOUNDATION
  avatar_visual_owner: OPENAI_WORK_PAGE
  additional_location_and_prop_anchors: INHERIT_FROM_P0_FOUNDATION
  location_generation: FORBIDDEN
  prop_generation: FORBIDDEN
  shot_api_status: NOT_CREATED_UNTIL_P1_PASS
  heygen_submission_status: NOT_SUBMITTED
  p3_kannada_lipsync_status: WAIT_FOR_P2_PICTURE_LOCK_AND_CREATOR_AUDIO
  p4_non_lipsync_voice_status: SEPARATE_NON_LIPSYNC_PHASE

