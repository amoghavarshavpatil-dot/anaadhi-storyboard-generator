submission_gate:
  batch_may_create_shot_payloads_only_if:
    - every_required_P1_reference_is_APPROVED
    - every_required_location_or_nested_space_is_bound
    - avatar_slots_for_that_shot_are_supplied_by_OPENAI_WORK_PAGE
    - no_unresolved_prop_vehicle_or_technology_reference_is_visible
  batch_may_submit_to_HeyGen_only_if:
    - shot_payload_passes_HeyGen_field_validation
    - required_private_avatar_consent_is_COMPLETE
    - all_media_URLs_are_public_HTTPS_or_HeyGen_asset_ids
    - exact_output_route_is_supported_by_the_selected_HeyGen_endpoint
    - work_page_execution_gate_is_explicitly_open

next_code_unit:
  id: HEYGEN-BATCH-MEDIA-VALIDATOR
  objective: >-
    Validate this schema against BATCH_REFERENCE_REQUIREMENTS, P1_BATCH_REFERENCE_BINDINGS,
    REFERENCE_REGISTRY and HEYGEN_API_ACCEPTANCE_CONTRACT without generating or submitting media.