name: Import LOC-016 Master from Drive

on:
  push:
    paths:
      - '.github/workflows/import-loc016-from-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download canonical LOC-016 master from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/references/locations/LOC-016
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1sDG17VFC6Tnc4H5VFHo3J1ZFL4-oXFJH&export=download&confirm=t' \
            -o production/references/locations/LOC-016/LOC-016_MASTER-01_Forest-Edge_Barter-Hamlet_3840x1600_FINAL.jpg

      - name: Verify JPEG and dimensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('production/references/locations/LOC-016/LOC-016_MASTER-01_Forest-Edge_Barter-Hamlet_3840x1600_FINAL.jpg')
          img = Image.open(p)
          assert img.format == 'JPEG', img.format
          assert img.size == (3840, 1600), img.size
          print('Verified canonical LOC-016 master:', img.size, img.format, p.stat().st_size)
          PY

      - name: Commit binary master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/locations/LOC-016/LOC-016_MASTER-01_Forest-Edge_Barter-Hamlet_3840x1600_FINAL.jpg
          if git diff --cached --quiet; then
            echo 'Binary already current.'
          else
            git commit -m 'Lock LOC-016 MASTER-01 canonical 4K environment asset'
            git push
          fi
