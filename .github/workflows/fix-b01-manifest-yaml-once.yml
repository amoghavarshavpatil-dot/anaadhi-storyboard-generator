name: Fix B01 Manifest YAML Once

on:
  push:
    paths:
      - '.github/workflows/fix-b01-manifest-yaml-once.yml'

permissions:
  contents: write

jobs:
  fix-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Repair literal newline defect and validate YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml')
          text = p.read_text(encoding='utf-8')
          bad = '  heygen_blocked_assets: [B01-AV-08]\\n  heygen_budget_deferred_assets: [B01-AV-08]'
          good = '  heygen_blocked_assets: [B01-AV-08]\n  heygen_budget_deferred_assets: [B01-AV-08]'
          if bad not in text:
              raise SystemExit('Expected literal \\n defect not found; refusing unrelated mutation')
          text = text.replace(bad, good, 1)
          yaml.safe_load(text)
          p.write_text(text, encoding='utf-8')
          PY
          test "$(git diff --name-only)" = 'production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml'
          ! git diff | grep -E '^\+.*(status: APPROVED|approved_root: true)' || exit 1
      - name: Commit formatting-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml
          git commit -m 'Fix B01 avatar manifest YAML newline'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 6
