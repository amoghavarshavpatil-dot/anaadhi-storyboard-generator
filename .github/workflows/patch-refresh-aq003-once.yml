name: Patch AQ-003 Narrowing and Refresh Once

on:
  push:
    paths:
      - '.github/workflows/patch-refresh-aq003-once.yml'

permissions:
  contents: write

jobs:
  patch-and-refresh-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Patch AQ-003 evolving dependency identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('production/heygen/refresh_zero_credit_controls.py')
          text = p.read_text(encoding='utf-8')

          old = '''OLD_V1_QUEUE_BLOB = "6ece360ace926b94d022b6eaa66ac4591db89b6d"\nP0_OPEN_IDS = {\n    "CONSENT::ANAADHI_PRIVATE_AVATAR": "HEYGEN-AQ-001",\n    "CONSENT::production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml": "HEYGEN-AQ-002",\n    "AVATAR_LOOK_SET::B01-AV-03,B01-AV-04,B01-AV-05,B01-AV-06,B01-AV-07,B01-AV-08,B01-AV-09": "HEYGEN-AQ-003",\n}\n'''
          new = '''OLD_V1_QUEUE_BLOB = "6ece360ace926b94d022b6eaa66ac4591db89b6d"\nP0_AQ003_PREVIOUS_DEP = "AVATAR_LOOK_SET::B01-AV-03,B01-AV-04,B01-AV-05,B01-AV-06,B01-AV-07,B01-AV-08,B01-AV-09"\nP0_AQ003_CURRENT_DEP = "AVATAR_LOOK_SET::B01-AV-08"\nP0_OPEN_IDS = {\n    "CONSENT::ANAADHI_PRIVATE_AVATAR": "HEYGEN-AQ-001",\n    "CONSENT::production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml": "HEYGEN-AQ-002",\n    P0_AQ003_CURRENT_DEP: "HEYGEN-AQ-003",\n}\n'''
          if old not in text:
              raise SystemExit('Expected P0_OPEN_IDS block not found')
          text = text.replace(old, new, 1)

          old = '''    matrix = {\n        "version": 3,\n'''
          new = '''    p0_overlay = old_matrix.get("p0_packet_overlay", {})\n    if isinstance(p0_overlay, dict):\n        for item in p0_overlay.get("highest_priority_open", []) or []:\n            if isinstance(item, dict) and item.get("packet_id") == "HEYGEN-AQ-003":\n                item["dependency_id"] = P0_AQ003_CURRENT_DEP\n                item["evidence"] = "B01 is factually 8/9 complete; only B01-AV-08 remains without a completed HeyGen look. Paid execution remains deferred."\n\n    matrix = {\n        "version": 3,\n'''
          if old not in text:
              raise SystemExit('Expected matrix anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('''        "p0_packet_overlay": old_matrix.get("p0_packet_overlay", {}),\n''', '''        "p0_packet_overlay": p0_overlay,\n''', 1)

          old = '''    plan["p0_state"] = {\n        "open_packet_ids": ["HEYGEN-AQ-001", "HEYGEN-AQ-002", "HEYGEN-AQ-003"],\n        "resolved_history_packet_ids": ["HEYGEN-AQ-004", "HEYGEN-AQ-005", "HEYGEN-AQ-006"],\n        "consent_handoff_status": "PREPARED_NOT_INITIATED",\n    }\n'''
          new = '''    plan["p0_state"] = {\n        "open_packet_ids": ["HEYGEN-AQ-001", "HEYGEN-AQ-002", "HEYGEN-AQ-003"],\n        "resolved_history_packet_ids": ["HEYGEN-AQ-004", "HEYGEN-AQ-005", "HEYGEN-AQ-006"],\n        "consent_handoff_status": "PREPARED_NOT_INITIATED",\n        "aq003_logical_packet_id": "HEYGEN-AQ-003",\n        "aq003_previous_dependency_id": P0_AQ003_PREVIOUS_DEP,\n        "aq003_current_dependency_id": P0_AQ003_CURRENT_DEP,\n        "aq003_narrowing_reason": "B01-AV-03/04/05/06/07/09 are completed; only B01-AV-08 remains deferred behind the credit gate.",\n    }\n'''
          if old not in text:
              raise SystemExit('Expected p0_state block not found')
          text = text.replace(old, new, 1)

          old = '''    # Hard lock historical P0 identities.\n    for dep_id, pid in P0_OPEN_IDS.items():\n'''
          new = '''    aq003_evolution_history = [{\n        "logical_packet_id": "HEYGEN-AQ-003",\n        "previous_dependency_id": P0_AQ003_PREVIOUS_DEP,\n        "current_dependency_id": P0_AQ003_CURRENT_DEP,\n        "status": "DEPENDENCY_NARROWED_BY_FACTUAL_B01_COMPLETION",\n        "reason": "Six previously unresolved looks completed and were reconciled; B01-AV-08 is the sole remaining look dependency.",\n        "paid_execution_authorized_by_history": False,\n    }]\n    # Remove the old seven-look key so AQ-003 cannot appear twice as active/history.\n    prior_by_dep.pop(P0_AQ003_PREVIOUS_DEP, None)\n\n    # Hard lock historical P0 logical packet identities to their current live dependencies.\n    for dep_id, pid in P0_OPEN_IDS.items():\n'''
          if old not in text:
              raise SystemExit('Expected hard-lock anchor not found')
          text = text.replace(old, new, 1)

          old = '''        "p0_identity_lock": {\n            "open": P0_OPEN_IDS,\n            "resolved_history_packet_ids": ["HEYGEN-AQ-004", "HEYGEN-AQ-005", "HEYGEN-AQ-006"],\n        },\n        "resolved_history": resolved_history,\n'''
          new = '''        "p0_identity_lock": {\n            "open": P0_OPEN_IDS,\n            "resolved_history_packet_ids": ["HEYGEN-AQ-004", "HEYGEN-AQ-005", "HEYGEN-AQ-006"],\n            "aq003_evolution_history": aq003_evolution_history,\n        },\n        "resolved_history": resolved_history,\n'''
          if old not in text:
              raise SystemExit('Expected queue p0_identity_lock block not found')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          compile(text, str(p), 'exec')
          PY
      - name: Refresh live zero-credit controls
        run: python production/heygen/refresh_zero_credit_controls.py
      - name: Verify AQ-003 and mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          q = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          packets = q['packets']
          aq3 = [p for p in packets if p['packet_id'] == 'HEYGEN-AQ-003']
          assert len(aq3) == 1, aq3
          assert aq3[0]['dependency_id'] == 'AVATAR_LOOK_SET::B01-AV-08', aq3[0]
          assert aq3[0]['zero_credit_execution_state'] == 'DEFERRED_UNTIL_CREDIT_READY_OR_EXPLICIT_EXECUTION_GATE'
          assert not aq3[0]['media_generation_allowed']
          assert not aq3[0]['heygen_submission_allowed']
          assert all('B01-AV-03' not in p['dependency_id'] for p in packets if p['packet_id'] != 'HEYGEN-AQ-003')
          assert q['credit_gate']['paid_heygen_work_ready'] is False
          assert q['credit_gate']['no_heygen_consent_or_media_execution'] is True
          PY
          changed="$(git diff --name-only)"
          expected=$'production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml\nproduction/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml\nproduction/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml\nproduction/heygen/refresh_zero_credit_controls.py'
          printf '%s\n' "$changed"
          test "$changed" = "$expected" || { echo 'Unexpected mutation scope'; exit 1; }
          ! git diff | grep -E '^\+.*(approved_root: true|status: APPROVED)' || { echo 'Forbidden approval promotion'; exit 1; }
      - name: Commit control-only refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/heygen/refresh_zero_credit_controls.py \
                  production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml \
                  production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Narrow AQ-003 to sole remaining B01 AV-08 look'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 6
