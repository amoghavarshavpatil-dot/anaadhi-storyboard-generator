name: Lock P1-C1 Anaadhi Master Identity

on:
  push:
    paths:
      - '.github/workflows/lock_p1_c1_anaadhi_identity.yml'
      - 'production/references/lock_p1_c1_anaadhi_identity.py'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        run: python -m pip install --quiet pillow

      - name: Download exact Drive blueprint sources
        run: |
          set -euo pipefail
          mkdir -p production/references/characters/anaadhi
          curl -fL --retry 4 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1S9ATxjhCp3tQp5jCmaY58v_DeliDgA7f&export=download&confirm=t' -o production/references/characters/anaadhi/CHR-ANAADHI_MASTER-IDENTITY-01_FACE_SOURCE.jpg
          curl -fL --retry 4 --retry-delay 2 'https://drive.usercontent.google.com/download?id=14xjdKBff58tJ8IWXEPkFbQrZb7nPACeK&export=download&confirm=t' -o production/references/characters/anaadhi/CHR-ANAADHI_MASTER-IDENTITY-01_BODY_PROPORTION_SOURCE.jpg

      - name: Build and validate canonical lock
        run: python production/references/lock_p1_c1_anaadhi_identity.py

      - name: Commit canonical assets and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/lock_p1_c1_anaadhi_identity.yml
          git config user.name 'ANAADHI Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Lock P1-C1 CHR-ANAADHI master identity reference set'
          git push origin HEAD:main
