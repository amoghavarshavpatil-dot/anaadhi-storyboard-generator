name: Validate ANAADHI Remotion Assembly

on:
  push:
    branches: [main]
    paths:
      - 'production/remotion/**'
      - '.github/workflows/remotion-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: production/remotion/package.json

      - name: Install Remotion dependencies
        run: npm install --no-audit --no-fund

      - name: Verify approved shot assets
        run: npm run verify:approved-shots

      - name: Typecheck
        run: npm run typecheck

      - name: Discover compositions
        run: npm run compositions
