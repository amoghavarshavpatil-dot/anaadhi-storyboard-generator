name: Create Anaadhi Age-27 Capture Body Look R3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heygen-create-anaadhi-capture-body-look-r3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-r3:
    runs-on: ubuntu-latest
    steps:
      - name: Create face-priority capture body look
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          FACE="https://raw.githubusercontent.com/amoghavarshavpatil-dot/anaadhi-storyboard-generator/main/production/references/characters/anaadhi/CHR-ANAADHI_MASTER-IDENTITY-01_FACE_SOURCE.jpg"
          GROUP="c26d836745e64d4c92663eae3fb02e06"
          PROMPT="Photoreal full-body ANAADHI age 27. Preserve the supplied FACE identity as the absolute priority: same cranial width, thick straight-natural brows, deep-set brown eyes and spacing, strong straight-base nose, balanced lips, broad masculine jaw/chin, medium-brown Karnataka/South-Indian skin. No beautifying or redesign. Adult stature exactly 193 cm / 6'4, naturally long-limbed. CAPTURE physique heavy-athletic and forest-built: broad shoulders, thick neck/traps, deep chest and ribcage, powerful back, dense upper arms/forearms, strong hips/glutes, thick quads, hamstrings and calves, low-moderate body fat. Powerful but natural; not shredded, bodybuilder, superhero or obese. Front full body, neutral relaxed stance, barefoot, fitted dark calibration shorts, seamless gray studio. No scars, wounds, bruises, blood, dirt, rain, props, text or rulers. Hair/facial hair non-authoritative."
          test ${#PROMPT} -le 1000
          jq -n --arg name "ANAADHI_AGE27_CAPTURE_BODY_R3" --arg prompt "$PROMPT" --arg group "$GROUP" --arg face "$FACE" \
            '{type:"prompt",name:$name,prompt:$prompt,avatar_group_id:$group,reference_images:[{type:"url",url:$face}]}' > /tmp/payload.json
          code=$(curl -sS -o /tmp/response.json -w "%{http_code}" -X POST https://api.heygen.com/v3/avatars \
            -H "x-api-key: ${HEYGEN_API_KEY}" -H "Content-Type: application/json" \
            -H "Idempotency-Key: anaadhi-age27-capture-body-r3-20260815" --data @/tmp/payload.json)
          echo "HeyGen HTTP status: ${code}"
          jq '{data:{avatar_item:{id:.data.avatar_item.id,name:.data.avatar_item.name,group_id:.data.avatar_item.group_id,status:.data.avatar_item.status,error:.data.avatar_item.error}},error:.error,message:.message,code:.code}' /tmp/response.json
          [ "$code" = "200" ]
