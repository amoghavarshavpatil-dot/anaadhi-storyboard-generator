name: Late ENV-6L Metadata Bindings Once

on:
  push:
    paths:
      - '.github/workflows/late-env6l-metadata-bindings-once.yml'

permissions:
  contents: write

jobs:
  apply-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply fail-closed metadata bindings
        run: python production/locations/apply_late_env6l_metadata_bindings.py
      - name: Verify mutation scope and safety
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml\nproduction/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml' || {
            echo 'Unexpected mutation scope; refusing commit.'
            exit 1
          }
          ! git diff | grep -E '^\+.*(approved_root: true|status: APPROVED)' || {
            echo 'Forbidden approval promotion detected.'
            exit 1
          }
      - name: Commit exact metadata controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'amoghavarshavpatil-dot'
          git config user.email 'amoghavarshavpatil@gmail.com'
          git add production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml
          git commit -m 'Bind late batches to frozen ENV-6L metadata'
          git push origin HEAD:main
