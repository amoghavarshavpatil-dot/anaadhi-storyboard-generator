name: HEYGEN Blocker Resolution Plan Once

on:
  push:
    paths:
      - .github/workflows/heygen-blocker-resolution-plan-once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-plan-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install planner dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Build resolution plan only
        run: |
          python production/heygen/build_heygen_blocker_resolution_plan.py --json
          test -s production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml

      - name: Commit planner output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml
          git diff --cached --check
          git commit -m "Build HeyGen blocker resolution plan"
          git push origin HEAD:main
