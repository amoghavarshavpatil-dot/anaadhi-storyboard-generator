name: Import and Lock LOC-061 Master

on:
  push:
    paths:
      - '.github/workflows/import-loc061-from-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download LOC-061 master from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/references/locations/LOC-061
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1ZaLHBrJYi3yNjmznOdDngAJTUYh088gr&export=download&confirm=t' \
            -o production/references/locations/LOC-061/LOC-061_MASTER-01_Bhaigaara-Forest-Flood-Channel_3840x1600_FINAL.jpg

      - name: Verify canonical binary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p = Path('production/references/locations/LOC-061/LOC-061_MASTER-01_Bhaigaara-Forest-Flood-Channel_3840x1600_FINAL.jpg')
          img = Image.open(p)
          assert img.format == 'JPEG', img.format
          assert img.size == (3840, 1600), img.size
          sha = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = 'ebd1dbcb5a50a9c770d4cdad0bd1434d274dafaf6bb19353c9451cadb06b9747'
          assert sha == expected, (sha, expected)
          print('Verified LOC-061:', img.size, img.format, p.stat().st_size, sha)
          PY

      - name: Lock LOC-061 in reference registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          asset = Path('production/references/locations/LOC-061/LOC-061_MASTER-01_Bhaigaara-Forest-Flood-Channel_3840x1600_FINAL.jpg')
          registry = Path('production/references/REFERENCE_REGISTRY.yaml')
          sha256 = hashlib.sha256(asset.read_bytes()).hexdigest()
          text = registry.read_text(encoding='utf-8')

          block = f'''  LOC-061:\n    name: "Bhaigaara Forest Flood Channel"\n    env6l_id: "LOC-061"\n    env6l_asset_lock_id: "ENV6L-LOC-061-ST00-v001"\n    env6j_prompt_id: "ENV6J-LOC-061-ST00-v001"\n    env6j_prompt_hash: "aff4b2e5293cb1c141272581851cdf38f08602ace7f84dd3caba59e58420774c"\n    environment_anchor: "ENV-BHG-022"\n    master_id: "LOC-061_MASTER-01"\n    canonical_state: "ST00"\n    class: "MODULAR-REUSE"\n    status: APPROVED\n    visual_lock_status: LOCKED\n    path: "production/references/locations/LOC-061/LOC-061_MASTER-01_Bhaigaara-Forest-Flood-Channel_3840x1600_FINAL.jpg"\n    sha256: "{sha256}"\n    raster: "3840x1600"\n    aspect_ratio: "2.40:1"\n    source_drive_file_id: "1ZaLHBrJYi3yNjmznOdDngAJTUYh088gr"\n    source_drive_parent_id: "1VoZ6KqmAFapSmhGA3LcdZp_2XHR_2z3z"\n    scene_bindings: [68]\n    authorised_kits: ["KIT-01", "KIT-02"]\n    continuity: "Bhaigaara flood/drainage channel under dense canopy with knee-deep scene water and physically coherent gravity-driven flow; broad, natural monsoon watercourse distinct from the adult-escape ravine."\n    collision_lock: "Distinct topology from LOC-060 adult escape ravine and LOC-010 child escape ravine; never inherit LOC-060 grate/narrow-ravine geometry, never full-topology reuse across distinct LOCs, and never drift into a deep river, waterfall gorge, culvert portal, institutional facade, or generic tunnel."\n    water_state_rule: "ST00 carries the Scene-068 knee-deep wading condition; preserve physically coherent downhill drainage and visible shallow-channel structure rather than impossible or oversized flood depth."\n    clean_master: "No people, animals, drones, vehicles, structures, signage, labels, UI, typography, maps, storyboard action, or Parallel-Earth overlays."\n    state_inheritance: "BASE/ST00"\n    scope_note: "Reference plate raster is exact 2.40:1; this does not replace the separate project delivery-raster rule."\n'''

          marker = '\nhero_props:'
          if marker not in text:
              raise SystemExit('hero_props marker not found in REFERENCE_REGISTRY.yaml')

          start_token = '\n  LOC-061:\n'
          start = text.find(start_token)
          if start != -1:
              end = text.find(marker, start)
              if end == -1:
                  raise SystemExit('Could not locate end of existing LOC-061 block')
              text = text[:start] + '\n' + block.rstrip('\n') + text[end:]
          else:
              idx = text.find(marker)
              text = text[:idx] + '\n\n' + block.rstrip('\n') + text[idx:]

          registry.write_text(text, encoding='utf-8')
          print('LOC-061 locked sha256:', sha256)
          PY

      - name: Commit canonical binary and registry lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/locations/LOC-061/LOC-061_MASTER-01_Bhaigaara-Forest-Flood-Channel_3840x1600_FINAL.jpg production/references/REFERENCE_REGISTRY.yaml
          if git diff --cached --quiet; then
            echo 'LOC-061 master already current.'
          else
            git commit -m 'Lock LOC-061 MASTER-01 Bhaigaara Forest Flood Channel'
            git push
          fi
