name: HeyGen API Auth Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heygen-api-auth-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify HEYGEN_API_KEY against HeyGen PAYG API
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HEYGEN_API_KEY:-}" ]; then
            echo "HEYGEN_API_KEY is missing from GitHub Actions secrets."
            exit 2
          fi

          http_code=$(curl -sS -o /tmp/heygen_user.json -w "%{http_code}" -H "x-api-key: ${HEYGEN_API_KEY}" https://api.heygen.com/v3/users/me)
          echo "HeyGen HTTP status: ${http_code}"

          if [ "${http_code}" != "200" ]; then
            echo "HeyGen authentication failed. Safe response summary:"
            jq '{error, message, code}' /tmp/heygen_user.json 2>/dev/null || echo "Non-JSON error response."
            exit 1
          fi

          echo "HeyGen authentication succeeded. Safe account/billing summary:"
          jq '(.data // .) | {authenticated:true, username, email, billing_type, wallet, subscription_plan:(.subscription.plan // null)}' /tmp/heygen_user.json
