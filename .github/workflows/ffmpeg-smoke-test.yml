name: FFmpeg Setup Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ffmpeg-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Verify media tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -f lavfi -i color=c=black:s=320x180:d=0.25 -c:v libx264 -pix_fmt yuv420p -y /tmp/anaadhi_ffmpeg_test.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/anaadhi_ffmpeg_test.mp4
