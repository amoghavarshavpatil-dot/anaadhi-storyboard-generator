name: Apply B29 Exact Location Correction Once

on:
  push:
    paths:
      - '.github/workflows/apply-b29-exact-location-correction-once.yml'

permissions:
  contents: write

jobs:
  apply-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply B29 exact metadata correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          req = Path('production/references/BATCH_REFERENCE_REQUIREMENTS.yaml')
          bind = Path('production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml')
          schema = Path('production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml')
          reg = Path('production/references/REFERENCE_REGISTRY.yaml')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(req,
              '    locations: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CENTRAL-COMMAND, LOC-PARAANE-PHARMACY-VAULT]\n    props: [PRP-ADK7-CARTRIDGE, PRP-PARAANE-EMBLEM, PRP-PARAANE-WRIST-DEVICE]',
              '    locations: [LOC-003, LOC-067, LOC-068]\n    props: [PRP-ADK7-CARTRIDGE, PRP-PARAANE-EMBLEM, PRP-PARAANE-WRIST-DEVICE]')

          replace_once(bind,
              '    pending_named_location_refs: [LOC-PARAANE-CENTRAL-COMMAND, LOC-PARAANE-PHARMACY-VAULT]\n    remaining_location_work: ["late Paraane subspaces", "hospital/council/pharmacy evidence locations"]',
              '    pending_named_location_refs: [LOC-067, LOC-068]\n    remaining_location_work: ["late Paraane subspaces", "hospital/council/pharmacy evidence locations"]')

          replace_once(schema,
              '    pending_named_location_refs: [LOC-PARAANE-CENTRAL-COMMAND, LOC-PARAANE-PHARMACY-VAULT]\n    p1_location_status: PARTIAL__LATE_ROOT_METADATA_BOUND__VISUAL_AND_SEMANTIC_GAPS_REMAIN\n    required_location_refs: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CENTRAL-COMMAND, LOC-PARAANE-PHARMACY-VAULT]',
              '    pending_named_location_refs: [LOC-067, LOC-068]\n    p1_location_status: PARTIAL__LATE_ROOT_METADATA_BOUND__VISUAL_AND_NESTED_GAPS_REMAIN\n    required_location_refs: [LOC-003, LOC-067, LOC-068]')

          reg_text = reg.read_text(encoding='utf-8')
          if '\n  LOC-067:\n' in reg_text or '\n  LOC-068:\n' in reg_text:
              raise SystemExit('LOC-067/068 already present in registry bridge; refuse duplicate insertion')
          addition = '''\n  LOC-067:\n    name: "Kendhalaa Convention Centre"\n    canonical_env6l_root: LOC-067\n    status: MISSING_APPROVED_ASSET\n    path: null\n    metadata_status: LOCKED\n    visual_status: METADATA_LOCKED_VISUAL_PENDING\n    visual_approval_implied: false\n    authority: production/locations/ENV6L_LOC062_087_CANONICAL_MAPPING.yaml\n  LOC-068:\n    name: "Paraane-Certified Pharmaceutical Store"\n    canonical_env6l_root: LOC-068\n    status: MISSING_APPROVED_ASSET\n    path: null\n    metadata_status: LOCKED\n    visual_status: METADATA_LOCKED_VISUAL_PENDING\n    visual_approval_implied: false\n    authority: production/locations/ENV6L_LOC062_087_CANONICAL_MAPPING.yaml\n'''
          reg.write_text(reg_text.rstrip() + addition, encoding='utf-8')

          # Parse every changed YAML file.
          req_doc = yaml.safe_load(req.read_text(encoding='utf-8'))
          bind_doc = yaml.safe_load(bind.read_text(encoding='utf-8'))
          schema_doc = yaml.safe_load(schema.read_text(encoding='utf-8'))
          reg_doc = yaml.safe_load(reg.read_text(encoding='utf-8'))

          assert req_doc['batches']['B29']['locations'] == ['LOC-003', 'LOC-067', 'LOC-068']
          assert bind_doc['location_bindings']['B29']['env6l_roots'] == ['LOC-003', 'LOC-067', 'LOC-068']
          assert bind_doc['location_bindings']['B29']['pending_named_location_refs'] == ['LOC-067', 'LOC-068']
          assert bind_doc['location_bindings']['B29']['approved_root'] == 'PARTIAL'
          assert schema_doc['batches']['B29']['required_location_refs'] == ['LOC-003', 'LOC-067', 'LOC-068']
          assert schema_doc['batches']['B29']['pending_named_location_refs'] == ['LOC-067', 'LOC-068']
          for loc in ['LOC-067', 'LOC-068']:
              r = reg_doc['late_env6l_numeric_root_references'][loc]
              assert r['status'] == 'MISSING_APPROVED_ASSET'
              assert r['path'] is None
              assert r['visual_approval_implied'] is False
          PY
      - name: Verify exact mutation scope and no approval promotion
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          expected=$'production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml\nproduction/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml\nproduction/references/BATCH_REFERENCE_REQUIREMENTS.yaml\nproduction/references/REFERENCE_REGISTRY.yaml'
          printf '%s\n' "$changed"
          test "$changed" = "$expected" || { echo 'Unexpected mutation scope'; exit 1; }
          ! git diff | grep -E '^\+.*(approved_root: true|status: APPROVED)' || { echo 'Forbidden approval promotion'; exit 1; }
      - name: Commit B29 metadata correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/REFERENCE_REGISTRY.yaml \
                  production/references/BATCH_REFERENCE_REQUIREMENTS.yaml \
                  production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml \
                  production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml
          git commit -m 'Correct B29 to exact LOC-003 LOC-067 LOC-068 roots'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 6
