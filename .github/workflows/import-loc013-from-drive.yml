name: Import and Lock LOC-013 Master

on:
  push:
    paths:
      - '.github/workflows/import-loc013-from-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download LOC-013 master from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/references/locations/LOC-013
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1QK9esSdNPtzUoDooJuP9EnHoJvf3-JhL&export=download&confirm=t' \
            -o production/references/locations/LOC-013/LOC-013_MASTER-01_Abandoned-Forest-Shrine_3840x1600_FINAL.jpg

      - name: Verify canonical binary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p = Path('production/references/locations/LOC-013/LOC-013_MASTER-01_Abandoned-Forest-Shrine_3840x1600_FINAL.jpg')
          img = Image.open(p)
          assert img.format == 'JPEG', img.format
          assert img.size == (3840, 1600), img.size
          sha = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = 'db606e80d21172021a70f1588821c8b408d5a1ae9cc5586c6ec73d538177918d'
          assert sha == expected, (sha, expected)
          print('Verified LOC-013:', img.size, img.format, p.stat().st_size, sha)
          PY

      - name: Lock LOC-013 in reference registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          asset = Path('production/references/locations/LOC-013/LOC-013_MASTER-01_Abandoned-Forest-Shrine_3840x1600_FINAL.jpg')
          registry = Path('production/references/REFERENCE_REGISTRY.yaml')
          sha256 = hashlib.sha256(asset.read_bytes()).hexdigest()
          text = registry.read_text(encoding='utf-8')

          block = f'''  LOC-013:\n    name: "Abandoned Forest Shrine"\n    env6l_id: "LOC-013"\n    env6l_asset_lock_id: "ENV6L-LOC-013-ST00-v001"\n    env6j_prompt_id: "ENV6J-LOC-013-ST00-v001"\n    env6j_prompt_hash: "81a7e3b329b44dd0adb72efbe9937c1792fef2176169fa985af8a56ebd60945f"\n    environment_anchor: "ENV-BHG-005"\n    master_id: "LOC-013_MASTER-01"\n    canonical_state: "ST00"\n    class: "DRESSING-VARIANT"\n    status: APPROVED\n    visual_lock_status: LOCKED\n    path: "production/references/locations/LOC-013/LOC-013_MASTER-01_Abandoned-Forest-Shrine_3840x1600_FINAL.jpg"\n    sha256: "{sha256}"\n    raster: "3840x1600"\n    aspect_ratio: "2.40:1"\n    source_drive_file_id: "1QK9esSdNPtzUoDooJuP9EnHoJvf3-JhL"\n    source_drive_parent_id: "1VoZ6KqmAFapSmhGA3LcdZp_2XHR_2z3z"\n    scene_bindings: [30]\n    authorised_kits: ["KIT-01", "KIT-08"]\n    signage_owner: "NONE"\n    continuity: "Small abandoned Bhaigaara forest shrine beneath a leaning jackfruit tree; low remnant shrine-stone precinct with incomplete enclosure, faceless local-stone deity, suspended weathered copper disc in the swing path of a broken electronic sensor, and clay rain bowl containing storm water."\n    architecture_rule: "Remain a restrained remnant sacred precinct with low shrine-stone zone, partial shelter/relic edge, shaded water-bowl side and sitting pocket; abandonment reads through incomplete enclosure rather than decorative ruin spectacle."\n    material_rule: "Long-weathered local stone, failing lime/earth joints, sparse muted clay and non-precious weathered metal; mineral grey, moss-dark green-brown, old lime and muted clay only. No glossy antique salvage, luxury finish, Hillside-Temple palette, or unrelated pan-Indian temple motifs."\n    weather_state_rule: "Scene-030 dawn after storm: cold wet terrain, rainwater on foliage and in clay bowl, natural dawn only; broken sensor remains dead technology except passive mechanical contact with the copper disc."\n    topology_rule: "Standalone ENV-BHG-005. Approach buffer and water-service path remain internal to this site. Never merge with LOC-012 Root Shelter, never assume measured adjacency, and never become the Hillside Temple."\n    clean_master: "No people, animals, signage, typography, UI, storyboard action, Parallel-Earth figures, decorative script, holograms, neon, active institutional technology, or new subspaces."\n    state_inheritance: "BASE/ST00"\n    scope_note: "Reference plate raster is exact 2.40:1; this does not replace the separate project delivery-raster rule."\n'''

          marker = '\nhero_props:'
          if marker not in text:
              raise SystemExit('hero_props marker not found in REFERENCE_REGISTRY.yaml')

          start_token = '\n  LOC-013:\n'
          start = text.find(start_token)
          if start != -1:
              end = text.find(marker, start)
              if end == -1:
                  raise SystemExit('Could not locate end of existing LOC-013 block')
              text = text[:start] + '\n' + block.rstrip('\n') + text[end:]
          else:
              idx = text.find(marker)
              text = text[:idx] + '\n\n' + block.rstrip('\n') + text[idx:]

          registry.write_text(text, encoding='utf-8')
          print('LOC-013 locked sha256:', sha256)
          PY

      - name: Commit canonical binary and registry lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/locations/LOC-013/LOC-013_MASTER-01_Abandoned-Forest-Shrine_3840x1600_FINAL.jpg production/references/REFERENCE_REGISTRY.yaml
          if git diff --cached --quiet; then
            echo 'LOC-013 master already current.'
          else
            git commit -m 'Lock LOC-013 MASTER-01 Abandoned Forest Shrine'
            git push
          fi
