name: Refresh Zero-Credit Controls After B29 Once

on:
  push:
    paths:
      - '.github/workflows/refresh-zero-credit-controls-b29-once.yml'

permissions:
  contents: write

jobs:
  refresh-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Refresh zero-credit controls
        run: python production/heygen/refresh_zero_credit_controls.py
      - name: Verify zero-credit safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          q = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          assert q['credit_gate']['paid_heygen_work_ready'] is False
          assert q['credit_gate']['no_heygen_consent_or_media_execution'] is True
          aq3 = [p for p in q['packets'] if p['packet_id'] == 'HEYGEN-AQ-003']
          assert len(aq3) == 1 and aq3[0]['dependency_id'] == 'AVATAR_LOOK_SET::B01-AV-08'
          assert not any('LOC-PARAANE-CENTRAL-COMMAND' in p['dependency_id'] and 'B29' in ','.join(p.get('impacted_batches', [])) for p in q['packets'])
          assert not any('LOC-PARAANE-PHARMACY-VAULT' in p['dependency_id'] and 'B29' in ','.join(p.get('impacted_batches', [])) for p in q['packets'])
          PY
          changed="$(git diff --name-only)"
          expected=$'production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml\nproduction/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml\nproduction/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml'
          test "$changed" = "$expected" || { printf '%s\n' "$changed"; exit 1; }
          ! git diff | grep -E '^\+.*(approved_root: true|status: APPROVED)' || exit 1
      - name: Commit refreshed controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml \
                  production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Refresh zero-credit queue after B29 location correction'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 6
