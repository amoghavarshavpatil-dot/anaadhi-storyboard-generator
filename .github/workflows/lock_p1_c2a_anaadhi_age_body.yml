name: Lock P1-C2A Anaadhi Age Body Family

on:
  push:
    paths:
      - '.github/workflows/lock_p1_c2a_anaadhi_age_body.yml'
      - 'production/references/lock_p1_c2a_anaadhi_age_body.py'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        run: python -m pip install --quiet pillow pyyaml

      - name: Download exact P1-C2A Drive backup
        run: |
          set -euo pipefail
          rm -rf /tmp/p1c2a
          mkdir -p /tmp/p1c2a
          curl -fL --retry 4 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1ybzUSnLGjB33ZxZo_Hp6tM8u_gnKF_1o&export=download&confirm=t' -o /tmp/p1c2a.zip
          unzip -q /tmp/p1c2a.zip -d /tmp/p1c2a
          mkdir -p production/references/characters/anaadhi/age_body/P1-C2A
          cp /tmp/p1c2a/CHR-ANAADHI_*_AGE-BODY-REF-01.png production/references/characters/anaadhi/age_body/P1-C2A/
          cp /tmp/p1c2a/CHR-ANAADHI_P1-C2A_AGE-BODY-FAMILY_CONTACT-SHEET.png production/references/characters/anaadhi/age_body/P1-C2A/

      - name: Build and validate canonical P1-C2A lock
        run: python production/references/lock_p1_c2a_anaadhi_age_body.py

      - name: Commit P1-C2A canonical assets
        run: |
          set -euo pipefail
          rm -f .github/workflows/lock_p1_c2a_anaadhi_age_body.yml
          git config user.name 'ANAADHI Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Lock P1-C2A Anaadhi age body family newborn to age 12'
          git push origin HEAD:main
