name: HEYGEN P0 No-New-Media Precheck Once

on:
  push:
    paths:
      - .github/workflows/heygen-p0-no-new-media-precheck-once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  precheck-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Execute P0 no-new-media GitHub precheck
        run: |
          python -m py_compile production/heygen/execute_p0_no_new_media_precheck.py
          python production/heygen/execute_p0_no_new_media_precheck.py

      - name: Rerun HEYGEN-BATCH-MEDIA-VALIDATOR
        shell: bash
        run: |
          set +e
          python production/heygen/validate_heygen_batch_media.py --json > /tmp/post-validator.json
          code=$?
          set -e
          cat /tmp/post-validator.json
          echo "validator_exit_code=$code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "Unexpected validator exit code: $code" >&2
            exit "$code"
          fi
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          payload = json.loads(Path('/tmp/post-validator.json').read_text())
          out = {
              'version': 1,
              'control': 'P0-NO-NEW-MEDIA-POST-VALIDATOR',
              'mode': 'VALIDATION_ONLY__ZERO_MEDIA_GENERATION__ZERO_HEYGEN_SUBMISSION',
              'validator_result': payload,
          }
          Path('production/heygen/P0_NO_NEW_MEDIA_POST_VALIDATOR.yaml').write_text(
              yaml.safe_dump(out, sort_keys=False, allow_unicode=True, width=140), encoding='utf-8'
          )
          PY

      - name: Verify safety and manifest assignment
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          evidence = yaml.safe_load(Path('production/heygen/P0_NO_NEW_MEDIA_GITHUB_PRECHECK.yaml').read_text())
          assert evidence['safety']['media_generated'] is False
          assert evidence['safety']['media_replaced'] is False
          assert evidence['safety']['heygen_called'] is False
          assert evidence['safety']['heygen_submission'] is False
          assert evidence['safety']['approved_status_changed'] is False
          assert len(evidence['b01_source_integrity']) == 7
          assert all(x['sha256_match'] for x in evidence['b01_source_integrity'].values())
          index = yaml.safe_load(Path('production/heygen/avatars/AVATAR_BATCH_INDEX.yaml').read_text())
          for bid in ('B24','B25','B26'):
              rec = index['batch_order'][bid]
              assert rec['manifest']
              assert 'PARTIAL_REUSE_B01_CAPTURE_IDENTITIES' in rec['status']
              assert Path(rec['manifest']).is_file()
          print(evidence['reuse_manifest_bindings'])
          PY

      - name: Commit factual precheck controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/heygen/P0_NO_NEW_MEDIA_GITHUB_PRECHECK.yaml \
                  production/heygen/P0_NO_NEW_MEDIA_POST_VALIDATOR.yaml \
                  production/heygen/avatars/AVATAR_BATCH_INDEX.yaml \
                  production/heygen/avatars/B24/B24_AVATAR_MANIFEST.yaml \
                  production/heygen/avatars/B25/B25_AVATAR_MANIFEST.yaml \
                  production/heygen/avatars/B26/B26_AVATAR_MANIFEST.yaml
          git diff --cached --check
          git commit -m "Execute HeyGen P0 no-new-media precheck"
          git push origin HEAD:main
