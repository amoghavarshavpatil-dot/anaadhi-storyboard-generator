name: AQ016 AQ018 Zero-Credit Control Refresh Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aq016-018-zero-credit-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Refresh matrix plan and action queue only
        shell: bash
        run: |
          set -euo pipefail
          python production/heygen/refresh_zero_credit_controls.py | tee /tmp/aq016_018_refresh.txt
      - name: Verify AQ016 AQ017 AQ018 remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          q = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          packets = {p['packet_id']: p for p in q['packets']}
          assert q['p0_identity_lock']['open']['CONSENT::ANAADHI_PRIVATE_AVATAR'] == 'HEYGEN-AQ-001'
          assert q['p0_identity_lock']['open']['CONSENT::production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml'] == 'HEYGEN-AQ-002'
          hist = {x['packet_id']: x for x in q['resolved_history']}
          assert hist['HEYGEN-AQ-003']['status'] == 'DEPENDENCY_RESOLVED_EVIDENCED'
          expected = {
              'HEYGEN-AQ-016': ('REF::CST-ANAADHI-CHILD-INSTITUTIONAL', ['B07','B08','B09','B10','B11']),
              'HEYGEN-AQ-017': ('REF::LOC-PARAANE-CAMPUS-MATURE', ['B26','B30','B33']),
              'HEYGEN-AQ-018': ('REF::LOC-BHAIGAARA-RAISED-CABIN', ['B01','B23','B24','B25']),
          }
          for pid, (dep, batches) in expected.items():
              p = packets[pid]
              assert p['dependency_id'] == dep, (pid, p['dependency_id'])
              assert p['impacted_batches'] == batches, (pid, p['impacted_batches'])
              assert p['status'] == 'OPEN_UNRESOLVED'
              assert p['media_generation_allowed'] is False
              assert p['heygen_submission_allowed'] is False
          assert q['credit_gate']['paid_heygen_work_ready'] is False
          assert q['credit_gate']['no_heygen_consent_or_media_execution'] is True
          PY
          changed="$(git diff --name-only)"
          expected=$'production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml\nproduction/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml\nproduction/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml'
          printf '%s\n' "$changed"
          test "$changed" = "$expected" || { echo 'Unexpected mutation scope'; exit 1; }
          ! git diff | grep -E '^\+.*status: APPROVED' || { echo 'Forbidden approval promotion'; exit 1; }
      - name: Commit refreshed controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml \
                  production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Refresh zero-credit controls after AQ016 AQ018 audit'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 6
