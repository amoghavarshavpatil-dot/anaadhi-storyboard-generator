name: AQ038-039-041 Packet Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-capture-qa-thumb-base64.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Materialize B02 wording locally and print packet evolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          b = Path('production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml')
          r = Path('production/heygen/refresh_zero_credit_controls.py')
          text = b.read_text()
          old = '    remaining_location_work: ["systems-lab nested interior"]\n'
          new = '    remaining_location_work: ["SUB-002-01 systems lab visual reference"]\n'
          assert text.count(old) == 1
          b.write_text(text.replace(old, new, 1))
          text = r.read_text()
          old_lock = '''LOGICAL_DEPENDENCY_PREFIX_LOCKS = {\n    "SPATIAL::B01::REMAINING_LOCATION_WORK::": "HEYGEN-AQ-037",\n    "SPATIAL::B24::REMAINING_LOCATION_WORK::": "HEYGEN-AQ-118",\n    "SPATIAL::B26::PENDING_NAMED_LOCATION::": "HEYGEN-AQ-120",\n}\n'''
          new_lock = '''LOGICAL_DEPENDENCY_PREFIX_LOCKS = {\n    "SPATIAL::B01::REMAINING_LOCATION_WORK::": "HEYGEN-AQ-037",\n    "SPATIAL::B02::REMAINING_LOCATION_WORK::": "HEYGEN-AQ-039",\n    "SPATIAL::B24::REMAINING_LOCATION_WORK::": "HEYGEN-AQ-118",\n    "SPATIAL::B26::PENDING_NAMED_LOCATION::": "HEYGEN-AQ-120",\n}\n'''
          assert text.count(old_lock) == 1
          r.write_text(text.replace(old_lock, new_lock, 1))
          PY
          python production/heygen/refresh_zero_credit_controls.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          q=yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          print('SUMMARY', q['summary'])
          new=set(q['summary'].get('new_packet_ids_allocated_this_refresh', []))
          for p in q.get('packets', []):
              if p.get('packet_id') in new:
                  print('NEW_PACKET', p)
          print('B24_LOOK_PACKETS')
          for p in q.get('packets', []):
              if str(p.get('dependency_id','')).startswith('AVATAR_LOOK_SET::B24'):
                  print(p)
          print('RECENT_SUPERSEDED')
          for p in q.get('superseded_history', []):
              if p.get('packet_id') in {'HEYGEN-AQ-198','HEYGEN-AQ-201'} or str(p.get('dependency_id','')).startswith('AVATAR_LOOK_SET::B24'):
                  print(p)
          PY
