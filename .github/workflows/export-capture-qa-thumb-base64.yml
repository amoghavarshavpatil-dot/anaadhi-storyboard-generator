name: AQ031-033 Zero Credit Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-capture-qa-thumb-base64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install YAML support
        run: python -m pip install --quiet pyyaml
      - name: Apply evidenced corrections across requirements schema and bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          req = Path('production/references/BATCH_REFERENCE_REQUIREMENTS.yaml')
          sch = Path('production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml')
          bind = Path('production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml')
          refresh = Path('production/heygen/refresh_zero_credit_controls.py')
          audit = Path('production/references/P1_AQ031_033_SHARED_ASSET_REUSE_AUDIT.yaml')

          a = req.read_text()
          replacements = [
              ('    locations: [LOC-FOREST-EDGE-BARTER, LOC-VILLAGE-HAND-PUMP]\n', '    locations: [LOC-FOREST-EDGE-BARTER]\n', 1),
              ('    locations: [LOC-FOREST-EDGE-BARTER, LOC-VILLAGE-HAND-PUMP, LOC-ANAADHI-HIDDEN-CABINS]\n', '    locations: [LOC-FOREST-EDGE-BARTER, LOC-ANAADHI-HIDDEN-CABINS]\n', 1),
              ('    locations: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE, LOC-PARAANE-HIGH-OBSERVATION]\n', '    locations: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE]\n', 1),
          ]
          for old, new, expected in replacements:
              assert a.count(old) == expected, (old, a.count(old))
              a = a.replace(old, new, expected)
          req.write_text(a)

          b = sch.read_text()
          schema_replacements = [
              ('    required_location_refs: [LOC-FOREST-EDGE-BARTER, LOC-VILLAGE-HAND-PUMP]\n', '    required_location_refs: [LOC-FOREST-EDGE-BARTER]\n', 1),
              ('    required_location_refs: [LOC-FOREST-EDGE-BARTER, LOC-VILLAGE-HAND-PUMP, LOC-ANAADHI-HIDDEN-CABINS]\n', '    required_location_refs: [LOC-FOREST-EDGE-BARTER, LOC-ANAADHI-HIDDEN-CABINS]\n', 1),
              ('    pending_named_location_refs: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE, LOC-PARAANE-HIGH-OBSERVATION]\n', '    pending_named_location_refs: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE]\n', 1),
              ('    required_location_refs: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE, LOC-PARAANE-HIGH-OBSERVATION]\n', '    required_location_refs: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE]\n', 1),
          ]
          for old, new, expected in schema_replacements:
              assert b.count(old) == expected, (old, b.count(old))
              b = b.replace(old, new, expected)
          sch.write_text(b)

          e = bind.read_text()
          old_binding = '    pending_named_location_refs: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE, LOC-PARAANE-HIGH-OBSERVATION]\n'
          new_binding = '    pending_named_location_refs: [LOC-PARAANE-CAMPUS-MATURE, LOC-PARAANE-CHILD-WING, LOC-PARAANE-ARCHIVE]\n'
          assert e.count(old_binding) == 1
          bind.write_text(e.replace(old_binding, new_binding, 1))

          c = refresh.read_text()
          anchor = 'P0_AQ003_CURRENT_DEP = "AVATAR_LOOK_SET::B01-AV-08"\n'
          constants = '''P0_AQ003_CURRENT_DEP = "AVATAR_LOOK_SET::B01-AV-08"\nLOGICAL_DEPENDENCY_PREFIX_LOCKS = {\n    "SPATIAL::B26::PENDING_NAMED_LOCATION::": "HEYGEN-AQ-120",\n}\n'''
          assert c.count(anchor) == 1
          c = c.replace(anchor, constants, 1)
          alias_anchor = '''    # Hard lock historical P0 logical packet identities to their current live dependencies.\n    for dep_id, pid in P0_OPEN_IDS.items():\n        if dep_id not in current_dep_ids:\n            raise SystemExit(f"P0 dependency disappeared unexpectedly: {dep_id}")\n        prior_by_dep[dep_id] = {"packet_id": pid, "dependency_id": dep_id}\n\n'''
          alias_block = alias_anchor + '''    # Preserve logical packet identity when canonical corrections narrow dependency payload text.\n    for prefix, locked_packet_id in LOGICAL_DEPENDENCY_PREFIX_LOCKS.items():\n        current_matches = [dep_id for dep_id in current_dep_ids if dep_id.startswith(prefix)]\n        if not current_matches:\n            continue\n        if len(current_matches) != 1:\n            raise SystemExit(f"Logical dependency prefix is ambiguous: {prefix} -> {current_matches}")\n        current_dep_id = current_matches[0]\n        prior_matches = [dep_id for dep_id in prior_by_dep if dep_id.startswith(prefix)]\n        for prior_dep_id in prior_matches:\n            prior_by_dep.pop(prior_dep_id, None)\n        prior_by_dep[current_dep_id] = {\n            "packet_id": locked_packet_id,\n            "dependency_id": current_dep_id,\n        }\n\n'''
          assert c.count(alias_anchor) == 1
          c = c.replace(alias_anchor, alias_block, 1)
          refresh.write_text(c)

          d = audit.read_text()
          old_expected = '''expected_refresh:\n  previous_total_blockers: 278\n  expected_removed_raw_blockers: 3\n  expected_total_blockers: 275\n  expected_aq031_batches: [B11]\n  expected_aq032_batches: [B13, B14]\n  expected_aq033_active: false\n  preserve_aq001_aq002_open: true\n  preserve_aq003_resolved_evidenced: true\n'''
          new_expected = '''expected_refresh:\n  previous_total_blockers: 278\n  expected_removed_raw_blockers: 3\n  expected_total_blockers: 275\n  blocker_delta_note: >-\n    B26 high-observation is removed consistently from requirements, HeyGen schema and the P1 binding ledger.\n    Its PENDING_NAMED_LOCATION blocker remains but narrows to the three valid B26 named location families,\n    and the same logical packet remains HEYGEN-AQ-120 with no HEYGEN-AQ-201 allocation.\n  expected_aq031_batches: [B11]\n  expected_aq032_batches: [B13, B14]\n  expected_aq033_active: false\n  expected_b26_spatial_packet_id: HEYGEN-AQ-120\n  expected_new_packet_ids: []\n  preserve_aq001_aq002_open: true\n  preserve_aq003_resolved_evidenced: true\n'''
          assert d.count(old_expected) == 1
          audit.write_text(d.replace(old_expected, new_expected, 1))
          PY
      - name: Refresh matrix plan and queue locally
        run: python production/heygen/refresh_zero_credit_controls.py
      - name: Assert scoped results packet identity and safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          q=yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          m=yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml').read_text())
          s=yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml').read_text())
          r=yaml.safe_load(Path('production/references/BATCH_REFERENCE_REQUIREMENTS.yaml').read_text())
          b=yaml.safe_load(Path('production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml').read_text())
          a=yaml.safe_load(Path('production/references/P1_AQ031_033_SHARED_ASSET_REUSE_AUDIT.yaml').read_text())
          packets={p['packet_id']:p for p in q['packets']}
          assert packets['HEYGEN-AQ-031']['impacted_batches']==['B11']
          assert packets['HEYGEN-AQ-031']['status']=='OPEN_UNRESOLVED'
          assert packets['HEYGEN-AQ-032']['impacted_batches']==['B13','B14']
          assert packets['HEYGEN-AQ-032']['status']=='OPEN_UNRESOLVED'
          assert 'HEYGEN-AQ-033' not in packets
          assert packets['HEYGEN-AQ-120']['dependency_id'].startswith('SPATIAL::B26::PENDING_NAMED_LOCATION::')
          assert 'LOC-PARAANE-HIGH-OBSERVATION' not in packets['HEYGEN-AQ-120']['dependency_id']
          assert packets['HEYGEN-AQ-120']['impacted_batches']==['B26']
          assert 'HEYGEN-AQ-201' not in packets
          assert q['summary']['new_packet_ids_allocated_this_refresh']==[]
          assert q['summary']['packet_namespace_high_watermark']=='HEYGEN-AQ-200'
          assert 'LOC-PARAANE-HIGH-OBSERVATION' not in r['batches']['B26']['locations']
          assert 'LOC-PARAANE-HIGH-OBSERVATION' not in s['batches']['B26']['required_location_refs']
          assert 'LOC-PARAANE-HIGH-OBSERVATION' not in s['batches']['B26']['pending_named_location_refs']
          assert 'LOC-PARAANE-HIGH-OBSERVATION' not in b['location_bindings']['B26']['pending_named_location_refs']
          assert 'LOC-VILLAGE-HAND-PUMP' not in r['batches']['B15']['locations']
          assert 'LOC-VILLAGE-HAND-PUMP' not in r['batches']['B16']['locations']
          assert 'LOC-VILLAGE-HAND-PUMP' not in s['batches']['B15']['required_location_refs']
          assert 'LOC-VILLAGE-HAND-PUMP' not in s['batches']['B16']['required_location_refs']
          assert s['batches']['B15']['env6l_roots']==['LOC-020','LOC-021','LOC-022','LOC-023','LOC-024','LOC-025','LOC-026']
          assert s['batches']['B16']['env6l_roots']==['LOC-027','LOC-028','LOC-029','LOC-030','LOC-031','LOC-032','LOC-033']
          assert q['p0_identity_lock']['open']['CONSENT::ANAADHI_PRIVATE_AVATAR']=='HEYGEN-AQ-001'
          assert 'HEYGEN-AQ-003' in q['p0_identity_lock']['resolved_history_packet_ids']
          assert m['report']['summary']['total_blockers']==275
          assert m['report']['summary']['global_blockers']==0
          assert a['expected_refresh']['expected_total_blockers']==275
          assert a['expected_refresh']['expected_b26_spatial_packet_id']=='HEYGEN-AQ-120'
          assert m['safety']['media_generated'] is False
          assert m['safety']['media_replaced'] is False
          assert m['safety']['approved_status_changed'] is False
          assert m['safety']['heygen_submission'] is False
          assert m['safety']['heygen_execution'] is False
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml
            production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml
            production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml
            production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
            production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml
            production/heygen/refresh_zero_credit_controls.py
            production/references/BATCH_REFERENCE_REQUIREMENTS.yaml
            production/references/P1_AQ031_033_SHARED_ASSET_REUSE_AUDIT.yaml
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" > /tmp/changed
          diff -u /tmp/expected /tmp/changed
      - name: Commit scoped zero-credit refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml production/references/BATCH_REFERENCE_REQUIREMENTS.yaml production/references/P1_AQ031_033_SHARED_ASSET_REUSE_AUDIT.yaml production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml production/heygen/refresh_zero_credit_controls.py production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Reconcile AQ-031 AQ-033 zero-credit reuse audit'
          git push
