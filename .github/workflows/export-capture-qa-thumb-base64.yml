name: AQ028-030 Zero Credit Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-capture-qa-thumb-base64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install YAML support
        run: python -m pip install --quiet pyyaml
      - name: Apply the single evidenced B12 shrine correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          req=Path('production/references/BATCH_REFERENCE_REQUIREMENTS.yaml')
          sch=Path('production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml')
          a=req.read_text()
          old='  B12:\n    scenes: [28,29,30,31,32,33,34]\n    anaadhi: [AGE-ANAADHI-12-FOREST, HR-ANAADHI-12-FOREST, CST-ANAADHI-12-ESCAPE, INJ-ANAADHI-12-ESCAPE]\n    locations: [LOC-FOREST-EDGE-BARTER, LOC-PARVARAN-JANNE-HOUSE]\n    props: [PRP-FOUR-ROAD-SHRINE]\n'
          new='  B12:\n    scenes: [28,29,30,31,32,33,34]\n    anaadhi: [AGE-ANAADHI-12-FOREST, HR-ANAADHI-12-FOREST, CST-ANAADHI-12-ESCAPE, INJ-ANAADHI-12-ESCAPE]\n    locations: [LOC-FOREST-EDGE-BARTER, LOC-PARVARAN-JANNE-HOUSE]\n    props: []\n'
          assert old in a and a.count(old)==1
          req.write_text(a.replace(old,new))
          b=sch.read_text()
          old2='  B12:\n    scenes: [28,29,30,31,32,33,34]\n    env6l_roots: [LOC-009, LOC-010, LOC-011, LOC-012, LOC-013, LOC-014, LOC-015, LOC-016, LOC-017]\n    p1_location_status: APPROVED_ROOTS__SCENE_STATE_DRESSING_REMAINS\n    required_location_refs: [LOC-FOREST-EDGE-BARTER, LOC-PARVARAN-JANNE-HOUSE]\n    required_anaadhi_refs: [AGE-ANAADHI-12-FOREST, HR-ANAADHI-12-FOREST, CST-ANAADHI-12-ESCAPE, INJ-ANAADHI-12-ESCAPE]\n    required_prop_refs: [PRP-FOUR-ROAD-SHRINE]\n'
          new2='  B12:\n    scenes: [28,29,30,31,32,33,34]\n    env6l_roots: [LOC-009, LOC-010, LOC-011, LOC-012, LOC-013, LOC-014, LOC-015, LOC-016, LOC-017]\n    p1_location_status: APPROVED_ROOTS__SCENE_STATE_DRESSING_REMAINS\n    required_location_refs: [LOC-FOREST-EDGE-BARTER, LOC-PARVARAN-JANNE-HOUSE]\n    required_anaadhi_refs: [AGE-ANAADHI-12-FOREST, HR-ANAADHI-12-FOREST, CST-ANAADHI-12-ESCAPE, INJ-ANAADHI-12-ESCAPE]\n    required_prop_refs: []\n'
          assert old2 in b and b.count(old2)==1
          sch.write_text(b.replace(old2,new2))
          PY
      - name: Refresh matrix plan and queue locally
        run: python production/heygen/refresh_zero_credit_controls.py
      - name: Assert scoped results and safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          q=yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          m=yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml').read_text())
          packets={p['packet_id']:p for p in q['packets']}
          assert packets['HEYGEN-AQ-028']['impacted_batches']==['B03','B05']
          assert packets['HEYGEN-AQ-029']['impacted_batches']==['B05']
          assert packets['HEYGEN-AQ-030']['impacted_batches']==['B11','B12']
          assert all(packets[x]['status']=='OPEN_UNRESOLVED' for x in ['HEYGEN-AQ-028','HEYGEN-AQ-029','HEYGEN-AQ-030'])
          assert q['p0_identity_lock']['open']['CONSENT::ANAADHI_PRIVATE_AVATAR']=='HEYGEN-AQ-001'
          assert 'HEYGEN-AQ-003' in q['p0_identity_lock']['resolved_history_packet_ids']
          assert m['report']['summary']['total_blockers']==278
          assert m['report']['summary']['global_blockers']==0
          assert m['safety']['media_generated'] is False
          assert m['safety']['media_replaced'] is False
          assert m['safety']['approved_status_changed'] is False
          assert m['safety']['heygen_submission'] is False
          assert m['safety']['heygen_execution'] is False
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml
            production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml
            production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
            production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml
            production/references/BATCH_REFERENCE_REQUIREMENTS.yaml
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" > /tmp/changed
          diff -u /tmp/expected /tmp/changed
      - name: Commit scoped zero-credit refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/BATCH_REFERENCE_REQUIREMENTS.yaml production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Reconcile AQ-028 AQ-030 zero-credit reuse audit'
          git push
