name: AQ034-035-037 Zero Credit Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-capture-qa-thumb-base64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install YAML support
        run: python -m pip install --quiet pyyaml
      - name: Apply evidenced dependency-wording corrections and packet locks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bindings = Path('production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml')
          refresh = Path('production/heygen/refresh_zero_credit_controls.py')

          b = bindings.read_text()
          old_b01 = '    remaining_location_work: ["raised-cabin interior identity", "split-floor continuity", "capture/breach later-state"]\n'
          new_b01 = '    remaining_location_work: ["SUB-001-02 main interior visual reference", "LOC-001 ST01 capture/breach visual state"]\n'
          assert b.count(old_b01) == 1, b.count(old_b01)
          b = b.replace(old_b01, new_b01, 1)

          old_b24 = '    remaining_location_work: ["Paraane central-command nested room", "pharmacy/ADK-7 vault canonical binding", "raised-cabin capture state"]\n'
          new_b24 = '    remaining_location_work: ["Paraane central-command nested room", "SUB-003-25 pharmaceutical transfer vault visual reference", "raised-cabin capture state"]\n'
          assert b.count(old_b24) == 1, b.count(old_b24)
          b = b.replace(old_b24, new_b24, 1)
          bindings.write_text(b)

          r = refresh.read_text()
          old_lock = '''LOGICAL_DEPENDENCY_PREFIX_LOCKS = {\n    "SPATIAL::B26::PENDING_NAMED_LOCATION::": "HEYGEN-AQ-120",\n}\n'''
          new_lock = '''LOGICAL_DEPENDENCY_PREFIX_LOCKS = {\n    "SPATIAL::B01::REMAINING_LOCATION_WORK::": "HEYGEN-AQ-037",\n    "SPATIAL::B24::REMAINING_LOCATION_WORK::": "HEYGEN-AQ-118",\n    "SPATIAL::B26::PENDING_NAMED_LOCATION::": "HEYGEN-AQ-120",\n}\n'''
          assert r.count(old_lock) == 1, r.count(old_lock)
          refresh.write_text(r.replace(old_lock, new_lock, 1))
          PY
      - name: Refresh matrix plan and queue locally
        run: python production/heygen/refresh_zero_credit_controls.py
      - name: Assert scoped results packet identity and safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path

          q = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          m = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml').read_text())
          b = yaml.safe_load(Path('production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml').read_text())
          packets = {p['packet_id']: p for p in q['packets']}
          superseded = {p['packet_id']: p for p in q.get('superseded_history', [])}

          assert packets['HEYGEN-AQ-034']['dependency_id'] == 'REF::VEH-ANAADHI-MOTORCYCLE'
          assert packets['HEYGEN-AQ-034']['impacted_batches'] == ['B19', 'B21']
          assert packets['HEYGEN-AQ-034']['status'] == 'OPEN_UNRESOLVED'

          assert packets['HEYGEN-AQ-035']['dependency_id'] == 'REF::LOC-PARAANE-PHARMACY-VAULT'
          assert packets['HEYGEN-AQ-035']['impacted_batches'] == ['B24']
          assert packets['HEYGEN-AQ-035']['status'] == 'OPEN_UNRESOLVED'

          assert packets['HEYGEN-AQ-037']['dependency_id'].startswith('SPATIAL::B01::REMAINING_LOCATION_WORK::')
          assert 'split-floor continuity' not in packets['HEYGEN-AQ-037']['dependency_id']
          assert 'SUB-001-02 main interior visual reference' in packets['HEYGEN-AQ-037']['dependency_id']
          assert 'LOC-001 ST01 capture/breach visual state' in packets['HEYGEN-AQ-037']['dependency_id']
          assert packets['HEYGEN-AQ-037']['impacted_batches'] == ['B01']
          assert packets['HEYGEN-AQ-037']['status'] == 'OPEN_UNRESOLVED'

          assert packets['HEYGEN-AQ-118']['dependency_id'].startswith('SPATIAL::B24::REMAINING_LOCATION_WORK::')
          assert 'SUB-003-25 pharmaceutical transfer vault visual reference' in packets['HEYGEN-AQ-118']['dependency_id']
          assert 'pharmacy/ADK-7 vault canonical binding' not in packets['HEYGEN-AQ-118']['dependency_id']
          assert packets['HEYGEN-AQ-118']['impacted_batches'] == ['B24']

          assert packets['HEYGEN-AQ-120']['dependency_id'].startswith('SPATIAL::B26::PENDING_NAMED_LOCATION::')
          assert packets['HEYGEN-AQ-120']['impacted_batches'] == ['B26']

          assert b['location_bindings']['B01']['remaining_location_work'] == [
              'SUB-001-02 main interior visual reference',
              'LOC-001 ST01 capture/breach visual state',
          ]
          assert b['location_bindings']['B24']['remaining_location_work'] == [
              'Paraane central-command nested room',
              'SUB-003-25 pharmaceutical transfer vault visual reference',
              'raised-cabin capture state',
          ]

          assert q['summary']['new_packet_ids_allocated_this_refresh'] == []
          assert q['summary']['packet_namespace_high_watermark'] == 'HEYGEN-AQ-200'
          assert q['summary']['active_action_packets'] == 180
          assert superseded['HEYGEN-AQ-033']['active'] is False
          assert superseded['HEYGEN-AQ-036']['active'] is False
          assert q['p0_identity_lock']['open']['CONSENT::ANAADHI_PRIVATE_AVATAR'] == 'HEYGEN-AQ-001'
          assert q['p0_identity_lock']['open']['CONSENT::production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml'] == 'HEYGEN-AQ-002'
          assert 'HEYGEN-AQ-003' in q['p0_identity_lock']['resolved_history_packet_ids']

          assert m['report']['summary']['selected_batches'] == 34
          assert m['report']['summary']['total_blockers'] == 275
          assert m['report']['summary']['global_blockers'] == 0
          assert m['safety']['media_generated'] is False
          assert m['safety']['media_replaced'] is False
          assert m['safety']['approved_status_changed'] is False
          assert m['safety']['heygen_submission'] is False
          assert m['safety']['heygen_execution'] is False
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml
            production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml
            production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml
            production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
            production/heygen/refresh_zero_credit_controls.py
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" > /tmp/changed
          diff -u /tmp/expected /tmp/changed
      - name: Commit scoped zero-credit refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml production/heygen/refresh_zero_credit_controls.py production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Reconcile AQ-034 AQ-035 AQ-037 zero-credit reuse audit'
          git push
