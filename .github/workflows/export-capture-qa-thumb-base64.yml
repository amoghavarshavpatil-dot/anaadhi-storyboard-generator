name: Export Capture QA Thumbnail Base64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-capture-qa-thumb-base64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split QA thumbnail into temporary text chunks
        shell: bash
        run: |
          set -euo pipefail
          SRC="production/references/characters/anaadhi/age_body/P1-B01-A/CHR-ANAADHI_AGE27_CAPTURE_BODY_HEYGEN-CANDIDATE-01_QA-THUMB.jpg"
          OUT="production/references/characters/anaadhi/age_body/P1-B01-A/.qa_chunks"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          base64 -w0 "$SRC" > /tmp/thumb.b64
          split -b 4000 -d -a 2 /tmp/thumb.b64 "$OUT/chunk_"
          for f in "$OUT"/chunk_*; do mv "$f" "$f.txt"; done
      - name: Commit temporary QA chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f production/references/characters/anaadhi/age_body/P1-B01-A/.qa_chunks/
          git commit -m "Temporary QA export for capture-body visual inspection"
          git push