name: Create Anaadhi Age-27 Capture Body Look R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heygen-create-anaadhi-capture-body-look-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-capture-look-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Create revised age-27 capture body look
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          FACE_URL="https://raw.githubusercontent.com/amoghavarshavpatil-dot/anaadhi-storyboard-generator/main/production/references/characters/anaadhi/CHR-ANAADHI_MASTER-IDENTITY-01_FACE_SOURCE.jpg"
          BODY_URL="https://raw.githubusercontent.com/amoghavarshavpatil-dot/anaadhi-storyboard-generator/main/production/references/characters/anaadhi/CHR-ANAADHI_MASTER-IDENTITY-01_BODY_PROPORTION_SOURCE.jpg"
          GROUP_ID="c26d836745e64d4c92663eae3fb02e06"

          PROMPT="Photoreal full-body neutral ANAADHI, age 27. Match FACE reference exactly: cranial width, brows, deep-set brown eyes/spacing, straight-base nose, lips, strong jaw/chin, medium-brown Karnataka/South-Indian identity. Do not beautify or redesign. Canonical adult height 193 cm / 6'4. BODY reference only for long-limbed proportions; ignore its printed 188 cm ruler and lean Scene-100 condition. CAPTURE physique visibly heavier and denser: broad shoulders, thick neck/traps, deep chest/ribcage, strong back, thick arms/forearms, hips/glutes, powerful thighs/calves, functional forest-built mass, low-moderate body fat. Not shredded, bodybuilder, superhero or obese. Front full body, relaxed neutral stance, barefoot, fitted dark calibration shorts, gray seamless studio. No scars, wounds, bruises, blood, dirt, rain, props, text, labels or rulers. Hair/facial hair non-authoritative."

          test ${#PROMPT} -le 1000

          jq -n \
            --arg name "ANAADHI_AGE27_CAPTURE_BODY_R2" \
            --arg prompt "$PROMPT" \
            --arg group "$GROUP_ID" \
            --arg face "$FACE_URL" \
            --arg body "$BODY_URL" \
            '{type:"prompt",name:$name,prompt:$prompt,avatar_group_id:$group,reference_images:[{type:"url",url:$face},{type:"url",url:$body}]}' \
            > /tmp/payload.json

          http_code=$(curl -sS \
            -o /tmp/response.json \
            -w "%{http_code}" \
            -X POST "https://api.heygen.com/v3/avatars" \
            -H "x-api-key: ${HEYGEN_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: anaadhi-age27-capture-body-r2b-20260815" \
            --data @/tmp/payload.json)

          echo "HeyGen HTTP status: ${http_code}"
          jq '{data:{avatar_item:{id:.data.avatar_item.id,name:.data.avatar_item.name,group_id:.data.avatar_item.group_id,status:.data.avatar_item.status,error:.data.avatar_item.error},avatar_group:{id:.data.avatar_group.id,status:.data.avatar_group.status,error:.data.avatar_group.error}},error:.error,message:.message,code:.code}' /tmp/response.json
          [ "$http_code" = "200" ]
