name: Apply B30 B33 Zero-Credit Routing Once

on:
  push:
    paths:
      - '.github/workflows/apply-b30-b33-zero-credit-routing-once.yml'

permissions:
  contents: write

jobs:
  apply-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply fail-closed B30/B33 routing
        run: python production/locations/apply_b30_b33_zero_credit_late_location_routing.py
      - name: Verify exact mutation scope and safety
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          expected=$'production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml\nproduction/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml\nproduction/references/BATCH_REFERENCE_REQUIREMENTS.yaml\nproduction/references/REFERENCE_REGISTRY.yaml'
          printf '%s\n' "$changed"
          test "$changed" = "$expected" || { echo 'Unexpected mutation scope'; exit 1; }
          ! git diff | grep -E '^\+.*(approved_root: true|status: APPROVED)' || { echo 'Forbidden approval promotion'; exit 1; }
          ! git diff | grep -E '^\+.*LOC-073.*B33' || true
      - name: Commit control-only routing corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/REFERENCE_REGISTRY.yaml \
                  production/references/BATCH_REFERENCE_REQUIREMENTS.yaml \
                  production/batches/P1_BATCH_REFERENCE_BINDINGS.yaml \
                  production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml
          git commit -m 'Apply zero-credit B30 B33 late-location routing'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 6
