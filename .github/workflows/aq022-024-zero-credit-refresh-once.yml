name: AQ022 AQ024 Zero-Credit Control Refresh Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aq022-024-zero-credit-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply exact B29 stale recovery visual corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          req = Path('production/references/BATCH_REFERENCE_REQUIREMENTS.yaml')
          schema = Path('production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml')

          def replace_exact(path, old, new, count=1):
              text = path.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {found}: {old!r}')
              path.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              req,
              '  B29:\n    scenes: [83,84,85,86]\n    anaadhi: [CST-ANAADHI-27-RECOVERY, INJ-ANAADHI-27-SURGERY]\n    locations: [LOC-003, LOC-067, LOC-068]\n',
              '  B29:\n    scenes: [83,84,85,86]\n    anaadhi: []\n    locations: [LOC-003, LOC-067, LOC-068]\n'
          )
          replace_exact(
              schema,
              '  B29:\n    scenes: [83,84,85,86]\n    env6l_roots: [LOC-003, LOC-067, LOC-068]\n    pending_named_location_refs: [LOC-067, LOC-068]\n    p1_location_status: PARTIAL__LATE_ROOT_METADATA_BOUND__VISUAL_AND_NESTED_GAPS_REMAIN\n    required_location_refs: [LOC-003, LOC-067, LOC-068]\n    required_anaadhi_refs: [CST-ANAADHI-27-RECOVERY, INJ-ANAADHI-27-SURGERY]\n',
              '  B29:\n    scenes: [83,84,85,86]\n    env6l_roots: [LOC-003, LOC-067, LOC-068]\n    pending_named_location_refs: [LOC-067, LOC-068]\n    p1_location_status: PARTIAL__LATE_ROOT_METADATA_BOUND__VISUAL_AND_NESTED_GAPS_REMAIN\n    required_location_refs: [LOC-003, LOC-067, LOC-068]\n    required_anaadhi_refs: []\n'
          )

          r = yaml.safe_load(req.read_text(encoding='utf-8'))['batches']
          s = yaml.safe_load(schema.read_text(encoding='utf-8'))['batches']

          assert r['B29']['anaadhi'] == []
          assert s['B29']['required_anaadhi_refs'] == []
          for b in ('B27','B28'):
              assert 'CST-ANAADHI-27-RECOVERY' in r[b]['anaadhi']
              assert 'INJ-ANAADHI-27-SURGERY' in r[b]['anaadhi']
              assert 'CST-ANAADHI-27-RECOVERY' in s[b]['required_anaadhi_refs']
              assert 'INJ-ANAADHI-27-SURGERY' in s[b]['required_anaadhi_refs']
          for b in ('B03','B24'):
              assert 'LOC-PARAANE-CENTRAL-COMMAND' in r[b]['locations']
              assert 'LOC-PARAANE-CENTRAL-COMMAND' in s[b]['required_location_refs']
          assert 'LOC-003' in s['B03']['env6l_roots']
          assert 'LOC-003' in s['B24']['env6l_roots']
          PY
      - name: Refresh matrix plan and action queue
        shell: bash
        run: |
          set -euo pipefail
          python production/heygen/refresh_zero_credit_controls.py | tee /tmp/aq022_024_refresh.txt
      - name: Verify AQ022 AQ023 AQ024 and safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          q = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          packets = {p['packet_id']: p for p in q['packets']}
          hist = {x['packet_id']: x for x in q['resolved_history']}

          assert q['p0_identity_lock']['open']['CONSENT::ANAADHI_PRIVATE_AVATAR'] == 'HEYGEN-AQ-001'
          assert q['p0_identity_lock']['open']['CONSENT::production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml'] == 'HEYGEN-AQ-002'
          assert 'HEYGEN-AQ-003' not in packets
          assert hist['HEYGEN-AQ-003']['status'] == 'DEPENDENCY_RESOLVED_EVIDENCED'

          aq22 = packets['HEYGEN-AQ-022']
          aq23 = packets['HEYGEN-AQ-023']
          aq24 = packets['HEYGEN-AQ-024']
          assert aq22['dependency_id'] == 'REF::LOC-PARAANE-CENTRAL-COMMAND'
          assert aq22['impacted_batches'] == ['B03','B24']
          assert aq23['dependency_id'] == 'REF::CST-ANAADHI-27-RECOVERY'
          assert aq23['impacted_batches'] == ['B27','B28']
          assert aq24['dependency_id'] == 'REF::INJ-ANAADHI-27-SURGERY'
          assert aq24['impacted_batches'] == ['B27','B28']
          for p in (aq22, aq23, aq24):
              assert p['status'] == 'OPEN_UNRESOLVED'
              assert p['media_generation_allowed'] is False
              assert p['heygen_submission_allowed'] is False

          m = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml').read_text())
          assert m['report']['summary']['global_blockers'] == 0
          assert m['report']['summary']['total_blockers'] == 280
          assert q['credit_gate']['no_heygen_consent_or_media_execution'] is True
          PY

          changed="$(git diff --name-only)"
          expected=$'production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml\nproduction/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml\nproduction/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml\nproduction/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml\nproduction/references/BATCH_REFERENCE_REQUIREMENTS.yaml'
          printf '%s\n' "$changed"
          test "$changed" = "$expected" || { echo 'Unexpected mutation scope'; exit 1; }
          ! git diff | grep -E '^\+.*status: APPROVED' || { echo 'Forbidden APPROVED status promotion'; exit 1; }
          ! git diff | grep -E '^\+.*approved_root: true' || { echo 'Forbidden root approval promotion'; exit 1; }
      - name: Commit control-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/BATCH_REFERENCE_REQUIREMENTS.yaml \
                  production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml \
                  production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Audit AQ022 AQ024 and remove stale B29 visual states'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 6
