name: AQ019 AQ021 Zero-Credit Control Refresh Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aq019-021-zero-credit-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply exact AQ019 stale physical-cartridge corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          req = Path('production/references/BATCH_REFERENCE_REQUIREMENTS.yaml')
          schema = Path('production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml')

          def replace_exact(path, old, new, count=1):
              text = path.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {found}: {old!r}')
              path.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(req,
              '  B29:\n    scenes: [83,84,85,86]\n    anaadhi: [CST-ANAADHI-27-RECOVERY, INJ-ANAADHI-27-SURGERY]\n    locations: [LOC-003, LOC-067, LOC-068]\n    props: [PRP-ADK7-CARTRIDGE, PRP-PARAANE-EMBLEM]\n',
              '  B29:\n    scenes: [83,84,85,86]\n    anaadhi: [CST-ANAADHI-27-RECOVERY, INJ-ANAADHI-27-SURGERY]\n    locations: [LOC-003, LOC-067, LOC-068]\n    props: [PRP-PARAANE-EMBLEM]\n')
          replace_exact(req,
              '  B30:\n    scenes: [87,88,89,90,91,92]\n    anaadhi: [AGE-ANAADHI-27-RECOVERY]\n    locations: [LOC-ADRAKA-SYSTEMS-LAB, LOC-PARAANE-CAMPUS-MATURE, LOC-PARVARAN-JANNE-HOUSE, LOC-068, LOC-069, LOC-070, LOC-071, LOC-080]\n    props: [PRP-ADK7-CARTRIDGE, PRP-PARAANE-EMBLEM]\n',
              '  B30:\n    scenes: [87,88,89,90,91,92]\n    anaadhi: [AGE-ANAADHI-27-RECOVERY]\n    locations: [LOC-ADRAKA-SYSTEMS-LAB, LOC-PARAANE-CAMPUS-MATURE, LOC-PARVARAN-JANNE-HOUSE, LOC-068, LOC-069, LOC-070, LOC-071, LOC-080]\n    props: [PRP-PARAANE-EMBLEM]\n')

          replace_exact(schema,
              '  B29:\n    scenes: [83,84,85,86]\n    env6l_roots: [LOC-003, LOC-067, LOC-068]\n    pending_named_location_refs: [LOC-067, LOC-068]\n    p1_location_status: PARTIAL__LATE_ROOT_METADATA_BOUND__VISUAL_AND_NESTED_GAPS_REMAIN\n    required_location_refs: [LOC-003, LOC-067, LOC-068]\n    required_anaadhi_refs: [CST-ANAADHI-27-RECOVERY, INJ-ANAADHI-27-SURGERY]\n    required_prop_refs: [PRP-ADK7-CARTRIDGE, PRP-PARAANE-EMBLEM]\n',
              '  B29:\n    scenes: [83,84,85,86]\n    env6l_roots: [LOC-003, LOC-067, LOC-068]\n    pending_named_location_refs: [LOC-067, LOC-068]\n    p1_location_status: PARTIAL__LATE_ROOT_METADATA_BOUND__VISUAL_AND_NESTED_GAPS_REMAIN\n    required_location_refs: [LOC-003, LOC-067, LOC-068]\n    required_anaadhi_refs: [CST-ANAADHI-27-RECOVERY, INJ-ANAADHI-27-SURGERY]\n    required_prop_refs: [PRP-PARAANE-EMBLEM]\n')
          replace_exact(schema,
              '  B30:\n    scenes: [87,88,89,90,91,92]\n    env6l_roots: [LOC-002, LOC-003, LOC-011, LOC-068, LOC-069, LOC-070, LOC-071, LOC-080]\n    mobile_refs: [LOC-076, LOC-077]\n    p1_location_status: ROUTING_AUDITED__EXACT_LATE_ROOTS_BOUND__VISUAL_AND_HELD_BEAT_GAPS_REMAIN\n    required_location_refs: [LOC-ADRAKA-SYSTEMS-LAB, LOC-PARAANE-CAMPUS-MATURE, LOC-PARVARAN-JANNE-HOUSE, LOC-068, LOC-069, LOC-070, LOC-071, LOC-080]\n    required_anaadhi_refs: [AGE-ANAADHI-27-RECOVERY]\n    required_prop_refs: [PRP-ADK7-CARTRIDGE, PRP-PARAANE-EMBLEM]\n',
              '  B30:\n    scenes: [87,88,89,90,91,92]\n    env6l_roots: [LOC-002, LOC-003, LOC-011, LOC-068, LOC-069, LOC-070, LOC-071, LOC-080]\n    mobile_refs: [LOC-076, LOC-077]\n    p1_location_status: ROUTING_AUDITED__EXACT_LATE_ROOTS_BOUND__VISUAL_AND_HELD_BEAT_GAPS_REMAIN\n    required_location_refs: [LOC-ADRAKA-SYSTEMS-LAB, LOC-PARAANE-CAMPUS-MATURE, LOC-PARVARAN-JANNE-HOUSE, LOC-068, LOC-069, LOC-070, LOC-071, LOC-080]\n    required_anaadhi_refs: [AGE-ANAADHI-27-RECOVERY]\n    required_prop_refs: [PRP-PARAANE-EMBLEM]\n')

          r = yaml.safe_load(req.read_text(encoding='utf-8'))['batches']
          s = yaml.safe_load(schema.read_text(encoding='utf-8'))['batches']
          for b in ('B01','B24'):
              assert 'PRP-ADK7-CARTRIDGE' in r[b]['props'] and 'PRP-ADK7-CARTRIDGE' in s[b]['required_prop_refs']
          for b in ('B29','B30'):
              assert 'PRP-ADK7-CARTRIDGE' not in r[b]['props'] and 'PRP-ADK7-CARTRIDGE' not in s[b]['required_prop_refs']
          for b in ('B01','B23','B24','B25'):
              assert 'PRP-SPLIT-FLOORBOARD' in r[b]['props'] and 'PRP-SPLIT-FLOORBOARD' in s[b]['required_prop_refs']
          for b in ('B01','B24','B25'):
              assert 'TEC-BLACK-KITE-DRONE' in r[b]['props'] and 'TEC-BLACK-KITE-DRONE' in s[b]['required_prop_refs']
          PY
      - name: Refresh matrix plan and action queue
        shell: bash
        run: |
          set -euo pipefail
          python production/heygen/refresh_zero_credit_controls.py | tee /tmp/aq019_021_refresh.txt
      - name: Verify AQ019 AQ020 AQ021 and safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          q = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml').read_text())
          m = yaml.safe_load(Path('production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml').read_text())
          packets = {p['packet_id']: p for p in q['packets']}
          assert q['p0_identity_lock']['open']['CONSENT::ANAADHI_PRIVATE_AVATAR'] == 'HEYGEN-AQ-001'
          assert q['p0_identity_lock']['open']['CONSENT::production/heygen/avatars/B01/B01_AVATAR_MANIFEST.yaml'] == 'HEYGEN-AQ-002'
          hist = {x['packet_id']: x for x in q['resolved_history']}
          assert hist['HEYGEN-AQ-003']['status'] == 'DEPENDENCY_RESOLVED_EVIDENCED'
          expected = {
              'HEYGEN-AQ-019': ('REF::PRP-ADK7-CARTRIDGE', ['B01','B24']),
              'HEYGEN-AQ-020': ('REF::PRP-SPLIT-FLOORBOARD', ['B01','B23','B24','B25']),
              'HEYGEN-AQ-021': ('REF::TEC-BLACK-KITE-DRONE', ['B01','B24','B25']),
          }
          for pid, (dep, batches) in expected.items():
              p = packets[pid]
              assert p['dependency_id'] == dep, (pid, p['dependency_id'])
              assert p['impacted_batches'] == batches, (pid, p['impacted_batches'])
              assert p['status'] == 'OPEN_UNRESOLVED'
              assert p['media_generation_allowed'] is False
              assert p['heygen_submission_allowed'] is False
          assert m['report']['summary']['total_blockers'] == 282, m['report']['summary']
          assert m['report']['summary']['global_blockers'] == 0
          assert q['credit_gate']['paid_heygen_work_ready'] is False
          assert q['credit_gate']['no_heygen_consent_or_media_execution'] is True
          PY
          changed="$(git diff --name-only)"
          expected=$'production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml\nproduction/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml\nproduction/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml\nproduction/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml\nproduction/references/BATCH_REFERENCE_REQUIREMENTS.yaml'
          printf '%s\n' "$changed"
          test "$changed" = "$expected" || { echo 'Unexpected mutation scope'; exit 1; }
          ! git diff | grep -E '^\+.*status: APPROVED' || { echo 'Forbidden approval promotion'; exit 1; }
      - name: Commit control-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/BATCH_REFERENCE_REQUIREMENTS.yaml \
                  production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml \
                  production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Audit AQ019 AQ021 and narrow ADK7 physical cartridge scope'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 6
