name: Refresh Zero-Credit HeyGen Controls Once

on:
  push:
    paths:
      - '.github/workflows/refresh-zero-credit-controls-once.yml'

permissions:
  contents: write

jobs:
  refresh-control-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Refresh live zero-credit controls
        run: python production/heygen/refresh_zero_credit_controls.py
      - name: Verify mutation scope and safety
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          expected=$'production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml\nproduction/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml\nproduction/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml'
          printf '%s\n' "$changed"
          test "$changed" = "$expected" || {
            echo 'Unexpected refresh mutation scope; refusing commit.'
            exit 1
          }
          ! git diff | grep -E '^\+.*(approved_root: true|status: APPROVED)' || {
            echo 'Forbidden approval promotion detected.'
            exit 1
          }
      - name: Commit refreshed controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'amoghavarshavpatil-dot'
          git config user.email 'amoghavarshavpatil@gmail.com'
          git add production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_RESOLUTION_PLAN.yaml \
                  production/heygen/HEYGEN_BATCH_DEPENDENCY_ACTION_QUEUE.yaml
          git commit -m 'Refresh zero-credit HeyGen dependency controls'
          git push origin HEAD:main
