name: Lock LOC-060 Reference Registry

on:
  push:
    paths:
      - '.github/workflows/lock-loc060-reference-registry.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock LOC-060 canonical reference entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          registry = Path('production/references/REFERENCE_REGISTRY.yaml')
          asset = Path('production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg')
          assert asset.exists(), asset
          sha256 = hashlib.sha256(asset.read_bytes()).hexdigest()

          text = registry.read_text(encoding='utf-8')
          entry = f'''  LOC-060:\n    name: "Forest Ravine — Adult Escape"\n    env6l_id: "LOC-060"\n    master_id: "LOC-060_MASTER-01"\n    status: APPROVED\n    path: "production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg"\n    sha256: "{sha256}"\n    raster: "3840x1600"\n    aspect_ratio: "2.40:1"\n    source_drive_file_id: "1YqfENxZUITlTa5jM_F_gDcLfL3eUzQEG"\n    source_drive_parent_id: "1VoZ6KqmAFapSmhGA3LcdZp_2XHR_2z3z"\n    continuity: "Adult-escape forest ravine; shallow wet drainage flow; slick rock cover; exposed wet roots; small corroded drainage grate partly concealed beneath roots; natural ravine remains dominant."\n    collision_lock: "HOLD-separated from LOC-010 child ravine and LOC-061 flood channel; never convert into a torrent, large culvert portal, cave, institutional facade, or generic tunnel mouth."\n    clean_master: "No people, animals, vehicles, signage, labels, or storyboard action."\n    scope_note: "Reference plate raster is exact 2.40:1; this does not replace the separate project delivery-raster rule."\n'''

          if '\n  LOC-060:\n' in text:
              print('LOC-060 registry entry already present; leaving unchanged.')
          else:
              marker = '\nhero_props:\n'
              if marker not in text:
                  raise SystemExit('hero_props marker not found in registry')
              text = text.replace(marker, '\n' + entry + marker, 1)
              registry.write_text(text, encoding='utf-8')
          print('LOC-060 sha256:', sha256)
          PY

      - name: Validate registry asset reference
        shell: bash
        run: |
          set -euo pipefail
          grep -A18 '^  LOC-060:' production/references/REFERENCE_REGISTRY.yaml
          test -f production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg

      - name: Commit registry lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/REFERENCE_REGISTRY.yaml
          if git diff --cached --quiet; then
            echo 'Registry already current.'
          else
            git commit -m 'Lock LOC-060 MASTER-01 in P1 reference registry'
            git push
          fi
