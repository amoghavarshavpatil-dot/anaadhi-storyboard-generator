name: Zyrex Store API probe

on:
  pull_request:
    branches: [zyrex-runner-base]
    types: [edited]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'zyrex-catalogue-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zyrex-catalogue-audit
          fetch-depth: 0
      - name: Probe official Store API and shop
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          ua={'User-Agent':'ZyrexCatalogueAudit-Probe/1.0'}
          def fetch(url):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,dict(r.headers),r.read().decode('utf-8','replace')
          out={}
          try:
              st,h,b=fetch('https://zyrexayurveda.com/wp-json/wc/store/v1/products?per_page=1&page=1')
              data=json.loads(b)
              out['store_api']={'status':st,'x_wp_total':h.get('X-WP-Total'),'x_wp_total_pages':h.get('X-WP-TotalPages'),'first_name':(data[0].get('name') if isinstance(data,list) and data else None)}
          except Exception as e:
              out['store_api']={'error':type(e).__name__+': '+str(e)}
          try:
              st,h,b=fetch('https://zyrexayurveda.com/shop/')
              m=re.search(r'Showing\s+\d+[–-]\d+\s+of\s+([\d,]+)\s+results',re.sub(r'<[^>]+>',' ',b),re.I)
              out['shop']={'status':st,'results_text_count':(int(m.group(1).replace(',','')) if m else None)}
          except Exception as e:
              out['shop']={'error':type(e).__name__+': '+str(e)}
          Path('data/zyrex').mkdir(parents=True,exist_ok=True)
          Path('data/zyrex/api_probe.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit probe output to isolated audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zyrex/api_probe.json
          git commit -m "Record Zyrex Store API probe [skip ci]" || exit 0
          git push origin HEAD:zyrex-catalogue-audit
