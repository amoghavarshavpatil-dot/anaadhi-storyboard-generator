name: Telegram Distribution Plugin CI

on:
  pull_request:
    paths:
      - "production/telegram-distribution/**"
      - ".github/workflows/telegram-distribution-ci.yml"
  push:
    branches:
      - "feature/telegram-whole-movie-distribution-v1"
    paths:
      - "production/telegram-distribution/**"
      - ".github/workflows/telegram-distribution-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/telegram-distribution
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Build and run integration tests
        run: npm test
