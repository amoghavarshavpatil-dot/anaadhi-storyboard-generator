name: Refresh LOC-060 Final Master

on:
  push:
    paths:
      - '.github/workflows/refresh-loc060-final-master.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final LOC-060 master from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/references/locations/LOC-060
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1Kr_SH7J4gRyRCjLl-8E6Y4oWz4S9Lo5_&export=download&confirm=t' \
            -o production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg

      - name: Verify JPEG and dimensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg')
          img = Image.open(p)
          assert img.format == 'JPEG', img.format
          assert img.size == (3840, 1600), img.size
          print('Verified final LOC-060 master:', img.size, img.format, p.stat().st_size)
          PY

      - name: Refresh LOC-060 registry block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          asset = Path('production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg')
          registry = Path('production/references/REFERENCE_REGISTRY.yaml')
          sha256 = hashlib.sha256(asset.read_bytes()).hexdigest()
          text = registry.read_text(encoding='utf-8')
          block = f'''  LOC-060:\n    name: "Forest Ravine — Adult Escape"\n    env6l_id: "LOC-060"\n    master_id: "LOC-060_MASTER-01"\n    status: APPROVED\n    path: "production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg"\n    sha256: "{sha256}"\n    raster: "3840x1600"\n    aspect_ratio: "2.40:1"\n    source_drive_file_id: "1Kr_SH7J4gRyRCjLl-8E6Y4oWz4S9Lo5_"\n    source_drive_parent_id: "1VoZ6KqmAFapSmhGA3LcdZp_2XHR_2z3z"\n    continuity: "Adult-escape forest ravine; shallow wet drainage flow; slick rock cover; exposed wet roots; corroded drainage grate partly concealed beneath roots with damaged lower section suitable only for difficult crawl-through; natural ravine remains dominant."\n    collision_lock: "HOLD-separated from LOC-010 child ravine and LOC-061 flood channel; never convert into a torrent, large culvert portal, cave, institutional facade, or generic tunnel mouth."\n    clean_master: "No people, animals, vehicles, signage, labels, or storyboard action."\n    scope_note: "Reference plate raster is exact 2.40:1; this does not replace the separate project delivery-raster rule."\n'''
          pattern = r'  LOC-060:\n(?:    .*\n)+?(?=\n hero_props:)'
          if not re.search(pattern, text):
              raise SystemExit('LOC-060 registry block not found')
          text = re.sub(pattern, block.rstrip('\n'), text, count=1)
          registry.write_text(text, encoding='utf-8')
          print('LOC-060 final sha256:', sha256)
          PY

      - name: Commit final binary and registry refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/references/locations/LOC-060/LOC-060_MASTER-01_Forest-Ravine-Adult-Escape_3840x1600_FINAL.jpg production/references/REFERENCE_REGISTRY.yaml
          if git diff --cached --quiet; then
            echo 'LOC-060 final master already current.'
          else
            git commit -m 'Refresh LOC-060 MASTER-01 final canonical asset'
            git push
          fi
