name: HEYGEN Validator Reconcile and Matrix

on:
  push:
    paths:
      - .github/workflows/heygen-validator-reconcile.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  reconcile-run-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Reconcile validator serialization and locked lipsync default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path("production/heygen/validate_heygen_batch_media.py")
          text = validator.read_text(encoding="utf-8")
          old = 'json.dumps(source, ensure_ascii=False)'
          new = 'json.dumps(source, ensure_ascii=False, default=str)'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one validator serialization target, found {text.count(old)}")
          validator.write_text(text.replace(old, new, 1), encoding="utf-8")

          schema = Path("production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml")
          text = schema.read_text(encoding="utf-8")
          old = "    enable_dynamic_duration: true\n    enable_speech_enhancement: false\n"
          new = "    enable_dynamic_duration: false\n    enable_speech_enhancement: false\n"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one precision-lipsync dynamic-duration target, found {text.count(old)}")
          schema.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run full B01-B34 validator and build blocker matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          import yaml

          command = ["python", "production/heygen/validate_heygen_batch_media.py", "--json"]
          completed = subprocess.run(command, text=True, capture_output=True)
          if completed.stderr:
              print(completed.stderr)
          if not completed.stdout.strip():
              raise SystemExit(f"Validator produced no JSON. Exit={completed.returncode}")
          try:
              report = json.loads(completed.stdout)
          except json.JSONDecodeError as exc:
              print(completed.stdout)
              raise SystemExit(f"Validator output is not JSON: {exc}")
          if completed.returncode not in (0, 2):
              raise SystemExit(f"Validator configuration/execution error: {completed.returncode}")

          matrix = {
              "version": 1,
              "project": "ANAADHI",
              "control": "HEYGEN-BATCH-BLOCKER-MATRIX",
              "mode": "VALIDATION_ONLY__ZERO_MEDIA_GENERATION__ZERO_HEYGEN_SUBMISSION",
              "validated_scope": "B01-B34 / SC001-SC100",
              "validated_repository_head": os.environ.get("GITHUB_SHA"),
              "generated_utc": datetime.now(timezone.utc).isoformat(),
              "validator_exit_code": completed.returncode,
              "gate_result": "PASS" if completed.returncode == 0 else "HARD_BLOCKED",
              "reconciliations_applied_before_validation": [
                  {
                      "code": "VALIDATOR_DATE_SERIALIZATION",
                      "action": "Allow YAML date objects to serialize as strings during read-only secret scanning.",
                      "media_changed": False,
                      "heygen_called": False,
                  },
                  {
                      "code": "LIPSYNC_DYNAMIC_DURATION_DEFAULT_DRIFT",
                      "action": "Align HEYGEN_BATCH_MEDIA_INPUT_SCHEMA precision-lipsync enable_dynamic_duration=false to the later locked HEYGEN_API_ACCEPTANCE_CONTRACT picture-lock-safe default.",
                      "media_changed": False,
                      "heygen_called": False,
                  },
              ],
              "report": report,
          }
          out = Path("production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml")
          out.write_text(yaml.safe_dump(matrix, sort_keys=False, allow_unicode=True, width=160), encoding="utf-8")
          print(json.dumps(report["summary"], indent=2))
          print("Blocked batches:", ", ".join(report["blocked_batches"]))
          print("Matrix:", out)
          PY

      - name: Commit reconciliation and blocker matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/heygen/validate_heygen_batch_media.py \
                  production/heygen/HEYGEN_BATCH_MEDIA_INPUT_SCHEMA.yaml \
                  production/heygen/HEYGEN_BATCH_BLOCKER_MATRIX.yaml
          git diff --cached --check
          git commit -m "Reconcile HeyGen validator and record blocker matrix"
          git push origin HEAD:main
