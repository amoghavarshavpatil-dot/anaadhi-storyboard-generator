name: Import HeyGen Capture Body Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heygen-import-capture-body-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch R2 HeyGen look and build QA assets
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          LOOK_ID="d6896745abf346f3a6ddefa6c8557bc8"
          OUT_DIR="production/references/characters/anaadhi/age_body/P1-B01-A"
          CHUNK_DIR="$OUT_DIR/.qa_chunks_r2"
          mkdir -p "$OUT_DIR"
          rm -rf "$CHUNK_DIR"
          mkdir -p "$CHUNK_DIR"

          curl -sS -H "x-api-key: ${HEYGEN_API_KEY}" \
            "https://api.heygen.com/v3/avatars/looks/${LOOK_ID}" -o /tmp/look.json

          STATUS=$(jq -r '.data.status // empty' /tmp/look.json)
          [ "$STATUS" = "completed" ]
          PREVIEW_URL=$(jq -r '.data.preview_image_url // empty' /tmp/look.json)
          [ -n "$PREVIEW_URL" ]

          FULL="$OUT_DIR/CHR-ANAADHI_AGE27_CAPTURE_BODY_HEYGEN-CANDIDATE-02.webp"
          THUMB="$OUT_DIR/CHR-ANAADHI_AGE27_CAPTURE_BODY_HEYGEN-CANDIDATE-02_QA-THUMB.jpg"
          curl -L --fail --silent --show-error "$PREVIEW_URL" -o "$FULL"

          python -m pip install --quiet pillow
          python - "$FULL" "$THUMB" <<'PY'
          import sys
          from PIL import Image
          src, dst = sys.argv[1], sys.argv[2]
          im = Image.open(src).convert('RGB')
          w = 360
          h = round(im.height * w / im.width)
          im = im.resize((w, h), Image.Resampling.LANCZOS)
          im.save(dst, 'JPEG', quality=76, optimize=True)
          PY

          SHA256=$(sha256sum "$FULL" | awk '{print $1}')
          THUMB_SHA256=$(sha256sum "$THUMB" | awk '{print $1}')
          BYTES=$(stat -c%s "$FULL")
          WIDTH=$(jq -r '.data.image_width // 0' /tmp/look.json)
          HEIGHT=$(jq -r '.data.image_height // 0' /tmp/look.json)
          NAME=$(jq -r '.data.name // empty' /tmp/look.json)

          cat > "$OUT_DIR/HEYGEN_CAPTURE_BODY_CANDIDATE_02.json" <<EOF
          {
            "phase": "P1-B01-A",
            "revision": "R2",
            "status": "CANDIDATE_VISUAL_QA_REQUIRED",
            "authority_scope": "AGE_BODY_GEOMETRY_ONLY",
            "canonical_identity_ref": "CHR-ANAADHI_MASTER-IDENTITY-01",
            "heygen_group_id": "c26d836745e64d4c92663eae3fb02e06",
            "heygen_look_id": "$LOOK_ID",
            "heygen_name": "$NAME",
            "image_path": "$FULL",
            "qa_thumbnail_path": "$THUMB",
            "image_width": $WIDTH,
            "image_height": $HEIGHT,
            "sha256": "$SHA256",
            "qa_thumbnail_sha256": "$THUMB_SHA256",
            "bytes": $BYTES,
            "adult_height_cm": 193,
            "body_source_188cm_ruler_is_noncanonical": true,
            "non_authoritative_pixels": ["hair", "facial_hair", "costume", "injury", "props", "environment"],
            "approval_required_before_registry_lock": true
          }
          EOF

          base64 -w0 "$THUMB" > /tmp/thumb-r2.b64
          split -b 4000 -d -a 2 /tmp/thumb-r2.b64 "$CHUNK_DIR/chunk_"
          for f in "$CHUNK_DIR"/chunk_*; do mv "$f" "$f.txt"; done

      - name: Commit R2 candidate and temporary QA chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f production/references/characters/anaadhi/age_body/P1-B01-A/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import HeyGen P1-B01-A capture-body candidate 02 for QA"
          git push
