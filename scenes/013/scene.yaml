records_control_room_chronology:
- Rain strikes the narrow windows.
- Parvaran enters using founders’ access.
- The automated hospital records system recognises him.
- Parvaran opens the newborn’s live file.
- The file initially records the child as healthy.
- Parvaran’s hand hovers over the keyboard.
- The restricted-alteration prompt appears.
- Parvaran types the deliberately false clinical justification ACUTE POSTNATAL CARDIORESPIRATORY FAILURE.
- The system asks CONFIRM DEATH?
- Parvaran initially cannot press it.
- TP010 / SB010 occurs only within its exact boundary.
- RST01 restores the unchanged Records Control Room with confirmation unpressed and zero residue.
- The Records Clerk enters carrying tea.
- Parvaran closes the file window and completes the exact dialogue exchange.
- The Clerk leaves.
- Parvaran reopens the same file.
- Parvaran presses CONFIRM.
- The physically healthy child becomes legally dead within the record system; no additional post-confirmation text is shown.
recovery_room_chronology:
- Direct screenplay-authorised editorial transition; no route or adjacency is depicted.
- Janne wakes slowly.
- The cradle beside her is physically empty.
- Parvaran sits near the window with his coat removed.
- Parvaran delivers false statements about a complication, breathing collapse and death.
- No body, clinical emergency or physical evidence supports the deception.
- Janne recalls hearing the newborn cry and feeling him hold her finger.
- Janne demands to see him and rejects being treated as a procedure.
- Parvaran cannot produce a body for the child he has declared legally dead.
- Parvaran falsely says the child is not in a condition to be seen.
- Janne challenges whether the problem is the child’s condition or Parvaran’s inability to face her.
- Parvaran tells her to rest.
- Janne turns away and reaches toward the empty cradle.
- TP011 / SB011 begins only at its exact boundary.
- RST01 restores Janne, Parvaran and the unchanged empty cradle with zero represented residue.
- Her fingers touch only the cold sheet.
- No music.
- Only rain.
dialogue:
- speaker: RECORDS CLERK
  text: Doctor, have you still not gone home?
- speaker: PARVARAN
  text: There is an emergency correction.
- speaker: RECORDS CLERK
  text: If there is a system correction at night, the morning shift will blame us, sir.
- speaker: RECORDS CLERK
  text: Is there any problem?
- speaker: PARVARAN
  text: No.
- speaker: PARVARAN
  text: You may leave.
- speaker: JANNE
  text: Where is the baby?
- speaker: JANNE
  text: Parvaran...
- speaker: PARVARAN
  text: There was a complication.
- speaker: JANNE
  text: What complication?
- speaker: PARVARAN
  text: His breathing suddenly collapsed.
- speaker: JANNE
  text: Where is he now?
- speaker: PARVARAN
  text: He did not survive.
- speaker: JANNE
  text: No.
- speaker: PARVARAN
  text: Janne--
- speaker: JANNE
  text: I heard him cry.
- speaker: PARVARAN
  text: I know.
- speaker: JANNE
  text: He held my finger.
- speaker: JANNE
  text: I want to see him.
- speaker: PARVARAN
  text: The procedure--
- speaker: JANNE
  text: I am his mother.
- speaker: JANNE
  text: Not a procedure.
- speaker: PARVARAN
  text: He is not in a condition to be seen now.
- speaker: JANNE
  text: Is he not?
- speaker: JANNE
  text: Or are you not?
- speaker: PARVARAN
  text: Get some rest.
