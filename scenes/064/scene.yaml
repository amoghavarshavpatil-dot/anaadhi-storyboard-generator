dialogue_sequence:
- 'ANARVAA: You contacted the accused alone.'
- 'AARATHI: The contact was successful.'
- 'ANARVAA: He has not been arrested.'
- 'AARATHI: Nobody died.'
- 'ANARVAA: Do you define that as success?'
- 'AARATHI: After seventeen murders? Yes.'
- 'PARVARAN: Open the original intake archive.'
- 'ANARVAA: After capture.'
- 'PARVARAN: Now.'
- 'ANARVAA: It has no operational relevance.'
- 'PARVARAN: He is a former Paraane resident. It has clinical relevance.'
- 'AARATHI: He has refused Paraane custody.'
- 'ANARVAA: An accused person does not choose custody.'
- 'UNNATH: An institution does not choose it either. Criminal custody belongs to the police.'
- 'ANARVAA: Under the Kendhalaa emergency charter, Paraane has authority over a high-risk psychiatric accused.'
- 'UNNATH: That same charter is under review.'
- 'ANARVAA: A review is not law.'
- 'AARATHI: Restore that line.'
- 'ANARVAA: He killed seventeen people.'
- 'AARATHI: That is why custody is required. Not an unexplained injection.'
- 'MEDICAL SPECIALIST: A standard compressed sedative. Weight-adjusted dose.'
- 'PARVARAN: Drug name?'
- 'MEDICAL SPECIALIST: PNX-4.'
- 'PARVARAN: Contraindications?'
- 'MEDICAL SPECIALIST: We do not have complete records.'
- 'PARVARAN: Then a direct injection should not be approved.'
- 'ANARVAA: You are unusually concerned about his clinical safety.'
- 'PARVARAN: The plan is unusually unsafe.'
- 'SEMMAA: Who is the allied group?'
- 'ASANA: Manimantharaa’s people.'
- 'SEMMAA: Why are gangsters part of a capture operation?'
- 'ANARVAA: Terrain support.'
- 'SEMMAA: Terrain needs a forest guide, not a revenge team.'
- 'ANARVAA: They will remain on the rear perimeter.'
- 'SEMMAA: If they enter the perimeter, I will throw them out.'
- 'ANARVAA: Follow the order.'
- 'SEMMAA: I will follow a capture order.'
- 'SEMMAA: Not an execution.'
- 'UNNATH: My officers will fire only if there is an immediate threat.'
- 'AARATHI: I will go inside first.'
- 'ANARVAA: No.'
- 'AARATHI: He expects my voice.'
- 'ANARVAA: That is exactly why you will remain on the outer line.'
- 'ADMINISTRATIVE OFFICER: Digital clearance is complete. A founder’s stamp is required.'
- 'UNNATH: An armed operation is waiting, and the system wants a rubber stamp.'
- 'SEMMAA: Who gave power to the rubber?'
- 'PARVARAN: We did.'
