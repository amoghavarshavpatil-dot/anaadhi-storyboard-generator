physical_chronology:
- The deserted city-edge junction and exactly four physical roads are established.
- The Kendhalaa city, Paraane, Bhaigaara forest boundary and Adraka destination arms are established without readable signs or compass assignments.
- The weak solar streetlight flickers above the weather-smoothed shrine stone.
- Parvaran’s car stops beneath the streetlight without depicting the hospital exit or route.
- Parvaran exits carrying the physically healthy newborn in the dark wool blanket.
- The newborn is awake, not crying and watching.
- Parvaran walks toward the centre of the junction and every step becomes harder.
- He places the newborn near the shrine platform, protected from direct rain.
- The newborn’s hand emerges; Parvaran gives him one finger; the child holds it; Parvaran closes his eyes.
- Parvaran delivers the exact source dialogue while preserving that his file/risk statements describe what he has already done.
- The newborn tightens his grip; Parvaran tells him to let go; the child does not.
- Parvaran carefully opens the tiny fingers one by one.
- TP012 / SB012 occurs only within its exact boundary.
- RST01 restores exactly four physical roads and all unchanged physical scene elements with zero represented residue.
- Only after RST01 does the physical newborn begin crying.
- Parvaran turns, takes two steps back toward the newborn and nearly returns.
- A Paraane patrol light appears far down the road; no personnel or vehicle identity is revealed.
- Parvaran sees it and retreats to his car.
- From inside ENV-MOB-001 he watches through rain-covered glass.
- Parvaran says they will take the child to rehabilitation and repeats He will be safe as justification, not established fact.
- The physically healthy newborn continues crying beneath the four physical roads.
- TP013 / SB013 occurs only within its exact audience-only future-V.O. boundary.
- RST05 restores the unchanged physical junction, rain, newborn and Parvaran’s car with zero represented residue.
- An approaching engine grows louder without revealing its vehicle, occupants or SC015 action.
