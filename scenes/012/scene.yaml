physical_chronology:
- The newborn rests inside the transparent temperature cradle.
- Biometric light travels gently across his skin.
- No needles.
- No restraints.
- The Neonatal Specialist studies the layered neural-development report while Parvaran stands beside her.
- Janne sleeps in recovery elsewhere and is not shown in the suite.
- The Specialist limits interpretation and rejects criminality, personality and violence prediction.
- The Specialist closes the risk projection and leaves to complete the standard discharge report.
- Parvaran's wrist device automatically synchronises the hospital findings with his Paraane profile.
- The Paraane risk program opens without being requested.
- Parvaran selects VIEW PROJECTED OUTCOMES.
- TP008 remains contained in the diegetic carrier.
- TP009 remains a fear-edited represented layer.
- RST05 restores the unchanged suite, real crying newborn, Parvaran and existing cradle with zero residue.
- The machine answers neither probability question.
- Parvaran looks toward the Paraane emblem on his wrist.
- He mistakes uncertainty for permission.
dialogue:
- speaker: PARVARAN
  text: How rare is this profile?
- speaker: NEONATAL SPECIALIST
  text: It is not rare. Only the interpretation is new.
- speaker: PARVARAN
  text: Behavioural risk?
- speaker: NEONATAL SPECIALIST
  text: It is already on the screen.
- speaker: NEONATAL SPECIALIST
  text: This is not a diagnosis. It is certainly not a sentence.
- speaker: PARVARAN
  text: There may be a difference in stress regulation.
- speaker: NEONATAL SPECIALIST
  text: There may be.
- speaker: PARVARAN
  text: Impulse threshold?
- speaker: NEONATAL SPECIALIST
  text: We do not know.
- speaker: PARVARAN
  text: Susceptibility to aggression?
- speaker: NEONATAL SPECIALIST
  text: We do not know.
- speaker: NEONATAL SPECIALIST
  text: '''We do not know'' does not mean danger, Doctor.'
- speaker: PARVARAN
  text: What if the environment becomes adverse?
- speaker: NEONATAL SPECIALIST
  text: An adverse environment can harm any child.
- speaker: PARVARAN
  text: The cases we have seen in Paraane--
- speaker: NEONATAL SPECIALIST
  text: Paraane's patients are not this child's future.
- speaker: NEONATAL SPECIALIST
  text: There may be a gene. Experience may come. Choice may grow.
- speaker: NEONATAL SPECIALIST
  text: What is before you today is not even a patient.
- speaker: NEONATAL SPECIALIST
  text: A newborn.
- speaker: PARVARAN
  text: What is the chance that I am wrong?
  delivery: quietly
- speaker: PARVARAN
  text: What is the chance that I am right?
