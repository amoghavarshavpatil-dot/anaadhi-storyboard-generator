physical_chronology:
- The storm has weakened outside the dry Emergency Intake envelope.
- Normal morning light enters through translucent stone panels.
- The compact care-led intake pavilion, uninterrupted stretcher axis, parallel circulation and protected threshold remain bounded to ENV-PAR-011.
- Manire receives the same newborn from the night team.
- "The private scanner shows only IDENTITY: UNKNOWN, FAMILY HISTORY: UNKNOWN and CLINICAL HISTORY: NONE."
- The Junior Intake Clerk types and proposes Male Infant Four-Junction.
- The exact rejected naming exchange occurs in source order.
- Manire takes the keyboard and types NAME PENDING.
- The system accepts only NAME PENDING without a tone or extra message.
- Manire gives the exact machine-and-training line.
- Manire examines the newborn with only necessary blanket repositioning.
- Manire states that his temperature has improved and orders feed preparation.
- The Child-Wing Doctor proposes long-term observation; Manire prioritizes milk.
- The Doctor begins the abandonment-trauma proposal and Manire interrupts it.
- Manire looks at the records.
- Manire states there is no injury, no sign of infection and no need for unnecessary medicine.
- The Doctor proposes a sedative; Manire rejects it; the Doctor withdraws the suggestion.
- Manire lifts the newborn; his physical crying settles against her shoulder.
- Manire says Yes...
- Manire walks slowly beside the window and delivers the two exact future-facing lines.
- The child's eyes follow ordinary morning light.
- Parvaran is revealed through the local observation glass in the local dark corridor.
- He has arrived before the staff change without a materialized journey, route or vehicle.
- Manire cannot see him.
- Parvaran watches Manire hold his son.
- The child turns toward the glass without recognition or supernatural meaning.
- Parvaran steps backward into shadow.
dialogue:
- {speaker: JUNIOR_CLERK, text: "Temporary name: 'Male Infant Four-Junction.'"}
- {speaker: MANIRE, text: "That is not a name. It is a police location."}
- {speaker: JUNIOR_CLERK, text: "The system will not allow the field to remain empty, madam."}
- {speaker: MANIRE, text: "Enter 'Baby.'"}
- {speaker: JUNIOR_CLERK, text: "It needs a minimum of two words."}
- {speaker: MANIRE, text: "'Baby Baby.'"}
- {speaker: JUNIOR_CLERK, text: "It will not accept a repeated word."}
- {speaker: MANIRE, text: "Even the machine has common sense. The people using it need training."}
- {speaker: MANIRE, text: "His temperature has improved. Prepare the feed."}
- {speaker: CHILD_WING_DOCTOR, text: "Shall we transfer him for long-term observation?"}
- {speaker: MANIRE, text: "Let him drink milk first."}
- {speaker: CHILD_WING_DOCTOR, text: "Abandonment trauma--"}
- {speaker: MANIRE, text: "Do not lecture a four-hour-old baby about trauma, Doctor."}
- {speaker: MANIRE, text: "There is no injury. There are no signs of infection. No unnecessary medicine."}
- {speaker: CHILD_WING_DOCTOR, text: "Not even a sedative?"}
- {speaker: MANIRE, text: "Why would a crying newborn need a sedative?"}
- {speaker: MANIRE, text: "Yes..."}
- {speaker: MANIRE, text: "Everyone here will write something about you."}
- {speaker: MANIRE, text: "When you grow up, speak for yourself."}
