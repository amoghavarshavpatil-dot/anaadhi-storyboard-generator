  exact_lines:
    - 'MANIRE: Filtered water. There is no medicine in it.'
    - 'MANIRE: Do you have a fever?'
    - 'ANAADHI: I do not know.'
    - 'MANIRE: Dizziness?'
    - 'ANAADHI: Sometimes the ground is not straight.'
    - 'MANIRE: After the injection?'
    - 'ANAADHI: I had visuals before as well. Now the doors will not stop.'
    - 'MANIRE: I suggest an examination.'
    - 'MANIRE: It is only a suggestion.'
    - 'ANAADHI: A Paraane doctor?'
    - 'MANIRE: An independent doctor, if you do not want Paraane.'
    - 'ANAADHI: Not now.'
    - 'MANIRE: All right.'
    - 'AARATHI: Manire, until what age was he here?'
    - 'MANIRE: Twelve.'
    - 'AARATHI: Family record?'
    - 'MANIRE: It said “unknown”.'
    - 'ANAADHI: Was that a lie?'
    - 'MANIRE: Later, I began to doubt that it was the complete truth.'
    - 'ANAADHI: Who knew?'
    - 'MANIRE: Parvaran.'
    - 'AARATHI: The rehabilitation head?'
    - 'MANIRE: Yes.'
    - 'ANAADHI: Did he see me?'
    - 'MANIRE: Many times.'
    - 'ANAADHI: Did he speak to me?'
    - 'MANIRE: No.'
    - 'ANAADHI: Then why did he watch?'
    - 'MANIRE: I asked him.'
    - 'ANAADHI: His answer?'
    - 'MANIRE: He did not give one.'
    - 'ANAADHI: I was inside.'
    - 'ANAADHI: He was outside.'
    - 'MANIRE: Yes.'
    - 'ANAADHI: He did not open the door.'
    - 'MANIRE: No.'
    - 'MANIRE: Anaadhi, the door is automatic.'
    - 'ANAADHI: Automatic fear is still fear.'
    - 'MANIRE: It is open.'
    - 'MANIRE: Can you see it?'
