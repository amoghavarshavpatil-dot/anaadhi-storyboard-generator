source:
  heading_ext: "EXT. BHAIGAARA BUFFER FOREST – ANAADHI’S RAISED CABIN – PRE-DAWN"
  heading_int: "INT. ANAADHI’S RAISED CABIN – SAME TIME"
  action_summary: >-
    Black rain in a future-evolved Karnataka Western Ghats forest. Kendhalaa Police,
    Paraane medical transports, Sarjanya and unofficial Allied Gangsters surround
    Anaadhi's raised cabin. A thermal wrist display confirms one body inside. After
    the command dialogue and a violent THUD, the scene moves inside: Anaadhi lies
    face-down, sedated but conscious enough to drag his fingers toward a split
    floorboard. His vision fractures into five Parallel Earth flashes before returning
    to the present and his V.O. about different uniforms shaped by the same fear.
  dialogue_source: creator_recorded

