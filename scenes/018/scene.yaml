- Parvaran’s office overlooks the child wing through the view-only AX01 window.
- The modest office and threshold-to-work route are established without materializing the Child Wing.
- The research screen shows the authorized philosophical diagram and quantum-consciousness model using only allowed text.
- Parvaran reads the proposition silently.
- A physical knock occurs.
- Manire enters carrying the same healthy living newborn.
- Manire states the administrative problem.
- Only then Parvaran closes unreadable personal records hidden beneath his research.
- The exact committee, legal-authority and temporary-care-name exchange occurs.
- Parvaran’s eyes finally move to the newborn and the newborn looks back.
- TP015 begins and ends only at its exact boundary.
- RST01 restores the unchanged physical office, Manire carrying the newborn and Parvaran staring at him with zero represented residue.
- Manire sees only Parvaran staring and says Doctor?
- Parvaran looks at the non-duality diagram; Beginning, End and no fixed first point remain silent thought and action.
- Parvaran says Anaadhi and the exact explanation and skeptical exchange follow.
- Parvaran waits half a second too long before the quieter second lie, No.
- Manire says Anaadhi three times in the exact source positions, with the latter two repetitions near the infant’s ear.
- Only after Manire’s third declarative Anaadhi does the naming system show the three authorized final fields.
- Paraane Rehabilitation Authority legally becomes the child’s parent without an invented process.
- Manire carries Anaadhi toward the door and the unnecessary-medication exchange occurs exactly.
- Manire leaves and Parvaran remains alone.
- The screen shows only SELF AND OTHER ARE NOT TWO.
- Parvaran looks through the view-only window at the child he has separated from himself.
dialogue:
- {speaker: MANIRE, text: "Doctor, there is an administrative problem."}
- {speaker: PARVARAN, text: "What is it?"}
- {speaker: MANIRE, text: "The baby still has no name."}
- {speaker: PARVARAN, text: "Let the intake committee decide."}
- {speaker: MANIRE, text: "The committee meets next week."}
- {speaker: MANIRE, text: "Should he remain 'Name Pending' until then?"}
- {speaker: PARVARAN, text: "We do not have legal naming authority."}
- {speaker: MANIRE, text: "We can give him a temporary care name."}
- {speaker: PARVARAN, text: "You may give him one."}
- {speaker: MANIRE, text: "I call every baby 'little one.'"}
- {speaker: MANIRE, text: "There are already six 'little ones' here. Whenever I call one, seven people look at me."}
- {speaker: ADULT_ANAADHI_PARALLEL_ECHO, text: "The one who gives a name does not necessarily give a life."}
- {speaker: MANIRE, text: "Doctor?"}
- {speaker: PARVARAN, text: "Anaadhi."}
- {speaker: MANIRE, text: "Anaadhi?"}
- {speaker: PARVARAN, text: "That which existed before the beginning and remains after the end."}
- {speaker: MANIRE, text: "I asked for a simple name for the baby."}
- {speaker: PARVARAN, text: "It is simple."}
- {speaker: MANIRE, text: "Do you know him?"}
- {speaker: PARVARAN, text: "No."}
- {speaker: MANIRE, text: "Anaadhi."}
- {speaker: MANIRE, text: "Anaadhi."}
- {speaker: MANIRE, text: "Anaadhi."}
- {speaker: PARVARAN, text: "Manire."}
- {speaker: PARVARAN, text: "Do not give him unnecessary medication."}
- {speaker: MANIRE, text: "It should not be given to anyone."}
