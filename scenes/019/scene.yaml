dialogue:
- {speaker: MANIRE, text: "Anaadhi."}
- {speaker: MANIRE, text: "This is fever medicine."}
- {speaker: MANIRE, text: "It will taste bitter. Only half a cup."}
- {speaker: CHILD_ANAADHI, text: "What if I say no?"}
- {speaker: MANIRE, text: "Tell me why you do not want it."}
- {speaker: CHILD_ANAADHI, text: "It is bitter."}
- {speaker: MANIRE, text: "Strong reason."}
- {speaker: MANIRE, text: "After the medicine, you will get a piece of jaggery."}
- {speaker: CHILD_ANAADHI, text: "Jaggery first."}
- {speaker: MANIRE, text: "You have learnt negotiation."}
- {speaker: CHILD_ANAADHI, text: "Jaggery first."}
- {speaker: ANARVAA, text: "You watch that child often."}
- {speaker: PARVARAN, text: "Child-wing review."}
- {speaker: ANARVAA, text: "Repeated review of one child creates bias."}
- {speaker: PARVARAN, text: "I was auditing the file."}
- {speaker: ANARVAA, text: "Abandoned children develop attachment complications."}
- {speaker: PARVARAN, text: "Some of them may."}
- {speaker: ANARVAA, text: "Paraane is his guardian."}
- {speaker: PARVARAN, text: "An institution cannot be a parent."}
- {speaker: ANARVAA, text: "Are you saying that as a founder?"}
- {speaker: ANARVAA, text: "Not as a father?"}
- {speaker: ANARVAA, text: "Come for the council review."}
- {speaker: ADULT_ANAADHI_VO, text: "He watched from a distance."}
- {speaker: ADULT_ANAADHI_VO, text: "I waited from inside."}
- {speaker: ADULT_ANAADHI_VO, text: "It was not only glass between us."}
- {speaker: ADULT_ANAADHI_VO, text: "It was his fear."}
