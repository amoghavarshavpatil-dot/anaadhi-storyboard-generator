dialogue_sequence:
  - "ANAADHI: You brought their names."
  - "AARATHI: You kept some of them. You did not know all of them."
  - "ANAADHI: Madhava was written inside the bag."
  - "AARATHI: You asked after he was dead."
  - "ANAADHI: Yes."
  - "AARATHI: I am not here to explain you to yourself. I am here to ask whether you will surrender."
  - "ANAADHI: To Paraane?"
  - "AARATHI: To police custody. Paraane will ask for medical control. I will oppose it."
  - "ANAADHI: Opposition is not protection."
  - "AARATHI: Correct. I cannot promise what I do not control."
  - "ANAADHI: In one version, you leave and I remain here."
  - "AARATHI: That is a possibility, not a defence."
  - "ANAADHI: I walked away before every death."
  - "AARATHI: And returned."
  - "ANAADHI: I had time."
  - "AARATHI: Yes."
  - "ANAADHI: Come back before dawn. Alone. Then I will tell you the terms."
  - "AARATHI: I will come back. I will not lie that I am the only person who knows I am here."
  - "ANAADHI: That is why you may leave."
