    - 'AARATHI: Release his hand.'
    - 'ATTENDANT: The medicine is necessary.'
    - 'ANAADHI: Did you explain it?'
    - 'ATTENDANT: Should I teach pharmacology to a child?'
    - 'MANIRE (O.S.): Correct.'
    - 'MANIRE: Anaadhi?'
