dialogue:
- {speaker: ELDERLY_RESIDENT, text: "Are you a doctor?"}
- {speaker: CHILD_ANAADHI, text: "No."}
- {speaker: ELDERLY_RESIDENT, text: "A nurse?"}
- {speaker: CHILD_ANAADHI, text: "No."}
- {speaker: ELDERLY_RESIDENT, text: "Then why did you help me?"}
- {speaker: CHILD_ANAADHI, text: "The strap was loose."}
- {speaker: MANIRE, text: "Anaadhi."}
- {speaker: MANIRE, text: "That plant is for treatment, not for repairing footwear."}
- {speaker: CHILD_ANAADHI, text: "Is it spoiled?"}
- {speaker: MANIRE, text: "No."}
- {speaker: MANIRE, text: "But ask me next time."}
- {speaker: CHILD_ANAADHI, text: "He might have fallen before I could ask."}
- {speaker: MANIRE, text: "Which one is medicine?"}
- {speaker: MANIRE, text: "Which one is compulsory to take?"}
- {speaker: CHILD_ANAADHI, text: "I will answer after I know why it is needed."}
- {speaker: MANIRE, text: "Correct answer."}
- {speaker: DISTRESSED_RESIDENT, text: "Sarjanya is coming! They will take everyone away!"}
- {speaker: CHILD_ANAADHI, text: "Who is Sarjanya?"}
- {speaker: MANIRE, text: "A group that began by helping people."}
- {speaker: CHILD_ANAADHI, text: "And now?"}
- {speaker: MANIRE, text: "Now there is no single answer."}
