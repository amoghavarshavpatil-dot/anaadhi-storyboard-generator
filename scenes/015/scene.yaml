physical_chronology:
- The open Sarjanya jeep moves through active rain along ENV-PLP-006, revealing the source of SC014's approaching engine without modifying SC014.
- Young Sarjanya members crowd the rear while returning from an overnight community patrol.
- Young Semmaa sits beside the unnamed Driver and already carries the stillness of a man others obey.
- Kenchaa holds the broken route projector upside down.
- Kenchaa states the map says they are on the right road; Driver states the map is upside down.
- Kenchaa rotates the device; its non-text arrow still points backward; Kenchaa repeats the right-road claim; Semmaa gives the exact restrained response.
- Another unnamed member opens the food container; the exact last-holige and brake exchange occurs without expanded comedy.
- A faint physical newborn cry enters beneath the engine noise; Semmaa raises one hand; everyone falls silent; the cry returns.
- The exact stop-jeep and cat exchange occurs.
- The jeep stops beside the same J-01 four-road junction.
- Semmaa steps into the rain; the others follow; they find the same healthy living newborn beside the same shrine stone; the humour vanishes.
- Semmaa kneels and asks who left the newborn there.
- The newborn's hand closes around Semmaa's wet finger.
- TP014 / SB014 occurs only within its exact PARALLEL-EARTH FLASH to BACK TO PRESENT boundary.
- RST01 restores the unchanged pre-pickup physical configuration with zero represented residue.
- Only after complete RST01 does Kenchaa check the physical darkness and the exact trap, workshop and refund exchange occurs.
- Semmaa lifts the physical newborn carefully and checks for injuries without establishing a finding.
- Semmaa states the newborn's body is becoming cold and asks for another blanket.
- Only then does an unnamed member remove his own shawl; it supplements rather than replaces the dark wool blanket.
- Driver proposes the police station; Kenchaa proposes a government children's home.
- Semmaa looks toward the distant Paraane complex without revealing SC016 architecture or gate action and names Paraane Rehabilitation's emergency wing.
- Driver asks whether Asana will open the gate; Semmaa gives the exact source response.
- Semmaa climbs into the Sarjanya jeep with the child protected against his chest and says Move.
- The Sarjanya jeep accelerates toward Paraane but does not arrive within SC015.
- From the separate hidden ENV-MOB-001 car, Parvaran watches; relief passes across his face, followed by shame.
- Parvaran remains until the Sarjanya jeep disappears. He does not follow.
dialogue:
- speaker: KENCHAA
  text: According to the map, we are on the right road.
- speaker: DRIVER
  text: The map is upside down.
- speaker: KENCHAA
  text: It is still showing that we are on the right road.
- speaker: SEMMAA
  text: You are more dangerous than the device.
- speaker: SARJANYA MEMBER
  text: Whose is the last holige?
- speaker: DRIVER
  text: The driver's.
- speaker: SARJANYA MEMBER
  text: Where is that rule written?
- speaker: DRIVER
  text: The brake is under my foot. That is the rule.
- speaker: SEMMAA
  text: Stop the jeep.
- speaker: KENCHAA
  text: It may be a cat.
- speaker: SEMMAA
  text: A cat does not cry like that.
- speaker: SEMMAA
  text: Who left you here, little one?
- speaker: KENCHAA
  text: Could it be a trap?
- speaker: SEMMAA
  text: If a baby is a trap, what training did you attend?
- speaker: KENCHAA
  text: The Sarjanya urban threat workshop.
- speaker: SEMMAA
  text: Ask for a refund.
- speaker: SEMMAA
  text: His body is becoming cold. Give me another blanket.
- speaker: DRIVER
  text: The police station?
- speaker: KENCHAA
  text: A government children's home?
- speaker: SEMMAA
  text: Paraane Rehabilitation's emergency wing.
- speaker: DRIVER
  text: Will Asana open the gate?
- speaker: SEMMAA
  text: If he does not, I will hand the baby to the gate.
- speaker: SEMMAA
  text: Move.
