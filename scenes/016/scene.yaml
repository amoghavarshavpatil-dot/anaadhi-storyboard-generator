physical_chronology:
- Paraane rises between long sloping hills in active night rain.
- Source-authorized black granite, laterite, carved timber, advanced medical glass and illuminated copper rain channels are established without expanding campus topology.
- The outer gate recognises the Sarjanya vehicle without revealing a mechanism.
- The display shows only NIGHT ACCESS RESTRICTED and STATE PURPOSE.
- The Sarjanya jeep stops outside.
- Young Asana approaches from the ENV-PAR-010 security-station zone.
- The exact patrol-report exchange occurs.
- Semmaa exits carrying the newborn protected against his chest.
- The exact source and guardian exchange occurs.
- Asana activates the gate-local emergency-intake interface.
- The four authorized categories appear unselected.
- The exact category dialogue occurs.
- The automatic police-notification, Sarjanya-record and Manimantharaa dialogue occurs without cutaways or visible records.
- Asana selects only MEDICAL EMERGENCY.
- The gate remains closed.
- INNER WARD AUTHORISATION REQUIRED and DUTY ADMINISTRATOR UNAVAILABLE appear.
- Kenchaa stares at the message and the exact procedural-delay exchange occurs.
- Semmaa looks through the bars and shifts the newborn into one arm.
- The exact gate-and-lock dialogue occurs without a physical break-in.
- Asana immediately performs the official override.
- Only then do the heavy gates open.
- The official/unofficial override exchange occurs.
- Unnamed medical workers hurry out with a thermal cradle.
- Semmaa looks once more at the newborn.
- Semmaa delivers the first name line; a faint smile touches him; he delivers the second name line.
- The workers receive the newborn without an invented cradle-placement action.
- The newborn is carried inside through the gate circulation without revealing SC017.
- The Paraane emblem closes above him.
dialogue:
- {speaker: ASANA, text: "Have you closed the patrol report?"}
- {speaker: SEMMAA, text: "A new report has opened now."}
- {speaker: ASANA, text: "Source?"}
- {speaker: SEMMAA, text: "The four-road junction."}
- {speaker: ASANA, text: "Guardian?"}
- {speaker: SEMMAA, text: "The rain."}
- {speaker: ASANA, text: "Semmaa, the form needs a proper answer."}
- {speaker: SEMMAA, text: "Write 'nobody' properly."}
- {speaker: ASANA, text: "We must select a category."}
- {speaker: KENCHAA, text: "Let us select all four."}
- {speaker: ASANA, text: "This is not a hotel menu."}
- {speaker: SEMMAA, text: "Medical emergency."}
- {speaker: ASANA, text: "The police notification will be automatic."}
- {speaker: SEMMAA, text: "Let it be."}
- {speaker: ASANA, text: "Sarjanya's involvement will be recorded."}
- {speaker: SEMMAA, text: "Let it be."}
- {speaker: ASANA, text: "Manimantharaa will question this."}
- {speaker: SEMMAA, text: "Let the baby breathe first. The boss can question us later."}
- {speaker: KENCHAA, text: "Do we have to wait for an emergency administrator to open the emergency gate?"}
- {speaker: ASANA, text: "We did not design the system."}
- {speaker: SEMMAA, text: "It does not matter who designed the gate."}
- {speaker: SEMMAA, text: "Breaking the lock is our department."}
- {speaker: ASANA, text: "I have officially overridden it."}
- {speaker: SEMMAA, text: "You could have unofficially done it sooner."}
- {speaker: SEMMAA, text: "If anyone here asks your name, do not answer."}
- {speaker: SEMMAA, text: "Let them find one for you first."}
